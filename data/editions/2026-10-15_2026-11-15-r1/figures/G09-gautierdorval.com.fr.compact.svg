</style><rect x="0" y="0" width="360" height="365" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Graphe documentaire indisponible</text><text x="20" y="54" class="st" text-anchor="start">Du 2026-10-15 au 2026-11-14 inclus, UTC ;</text><text x="20" y="71" class="st" text-anchor="start">fin exclusive 2026-11-15.</text><text x="20" y="88" class="st" text-anchor="start">Accès consignés GET 200 aux documents</text><text x="20" y="105" class="st" text-anchor="start">principaux ; niveau provider-origin ; rôles</text><text x="20" y="122" class="st" text-anchor="start">automatisés seulement.</text><text x="20" y="167" class="st" text-anchor="start">gautierdorval.com</text><text x="20" y="187" class="st" text-anchor="start">Aucun instantané documentaire qualifié dans</text><text x="20" y="207" class="st" text-anchor="start">ce contrat. Aucun graphe ni élément de cas</text><text x="20" y="227" class="st" text-anchor="start">n'est déduit.</text><line x1="20" y1="249" x2="340" y2="249" class="grid"/><text x="20" y="267" class="ft" text-anchor="start">27 jours archivés partiels ; 4 jours</text><text x="20" y="282" class="ft" text-anchor="start">indisponibles. Indisponible ne signifie pas zéro.</text><text x="20" y="297" class="ft" text-anchor="start">Les rôles consignés ne prouvent ni entraînement</text><text x="20" y="312" class="ft" text-anchor="start">ni citation. Accès à la demande retenus (U0).</text><text x="20" y="327" class="ft" text-anchor="start">Candidate locale du profil B. Source :</text><text x="20" y="342" class="ft" text-anchor="start">projection.json: graphs</text></svg>
