<svg xmlns="http://www.w3.org/2000/svg" width="360" height="365" viewBox="0 0 360 365" role="img" aria-labelledby="title desc"><title id="title">Graphe documentaire indisponible</title><desc id="desc">Graphe documentaire indisponible. Du 2026-10-15 au 2026-11-14 inclus, UTC ; fin exclusive 2026-11-15. Accès consignés GET 200 aux documents principaux ; niveau provider-origin ; rôles automatisés seulement.</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6e69;--grid:#e1e0d9;--axis:#c9c8c1;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s5:#e87ba4;--s7:#6250d6;--neutral:#a3a29b;--neutral2:#d4d3cc;
--missing:#7a5c00;--band:#f3efe2}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a29b;
