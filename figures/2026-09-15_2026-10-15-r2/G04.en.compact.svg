</style><rect x="0" y="0" width="420" height="748" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Distinct site-path pairs requested, and</text><text x="20" y="52" class="t" text-anchor="start">recurrence</text><text x="20" y="76" class="st" text-anchor="start">September 15 to October 14, 2026 inclusive, UTC.</text><text x="20" y="93" class="st" text-anchor="start">Unit: site-path pairs (URLs), not consumers.</text><text x="20" y="110" class="st" text-anchor="start">Distinct counts are computed on pairs, never by</text><text x="20" y="127" class="st" text-anchor="start">adding per-actor counts.</text><text x="20" y="154" class="vl" text-anchor="start">A. Main documentary population: pairs with rows in the</text><text x="20" y="170" class="vl" text-anchor="start">window, and pairs with at least one provider-origin AI</text><text x="20" y="186" class="vl" text-anchor="start">GET 200</text><text x="142" y="216" class="lb" text-anchor="end">gautierdorval.com</text><rect x="150" y="204" width="165.73" height="16" fill="var(--neutral2)"><title>gautierdorval.com: 113 pairs with rows</title></rect><path d="M150,208H209.07Q213.07,208 213.07,212V212Q213.07,216 209.07,216H150Z" fill="var(--s1)"><title>gautierdorval.com: 43 pairs with provider-origin AI GET 200</title></path><text x="321.73" y="216" class="vl" text-anchor="start">43 of 113</text><text x="142" y="250" class="lb" text-anchor="end">pagup.com</text><rect x="150" y="238" width="89.47" height="16" fill="var(--neutral2)"><title>pagup.com: 61 pairs with rows</title></rect><path d="M150,242H206.13Q210.13,242 210.13,246V246Q210.13,250 206.13,250H150Z" fill="var(--s2)"><title>pagup.com: 41 pairs with provider-origin AI GET 200</title></path><text x="245.47" y="250" class="vl" text-anchor="start">41 of 61</text><text x="142" y="284" class="lb" text-anchor="end">better-robots.com</text><rect x="150" y="272" width="139.33" height="16" fill="var(--neutral2)"><title>better-robots.com: 95 pairs with rows</title></rect><path d="M150,276H278Q282,276 282,280V280Q282,284 278,284H150Z" fill="var(--s3)"><title>better-robots.com: 90 pairs with provider-origin AI GET 200</title></path><text x="295.33" y="284" class="vl" text-anchor="start">90 of 95</text><text x="20" y="308" class="ax" text-anchor="start">Wide grey bar: pairs with rows (all recorded</text><text x="20" y="323" class="ax" text-anchor="start">classifications). Thin bar: pairs with at least one</text><text x="20" y="338" class="ax" text-anchor="start">provider-origin AI GET 200.</text><text x="20" y="363" class="vl" text-anchor="start">B. Recurrence: number of UTC days with at least one</text><text x="20" y="379" class="vl" text-anchor="start">provider-origin AI GET 200, per requested pair</text><line x1="40" y1="519" x2="400" y2="519" class="grid"/><text x="36" y="523" class="ax" text-anchor="end">0</text><line x1="40" y1="491.5" x2="400" y2="491.5" class="grid"/><text x="36" y="495.5" class="ax" text-anchor="end">20</text><line x1="40" y1="464" x2="400" y2="464" class="grid"/><text x="36" y="468" class="ax" text-anchor="end">40</text><line x1="40" y1="436.5" x2="400" y2="436.5" class="grid"/><text x="36" y="440.5" class="ax" text-anchor="end">60</text><line x1="40" y1="409" x2="400" y2="409" class="grid"/><text x="36" y="413" class="ax" text-anchor="end">80</text><path d="M53,519V480.38Q53,476.38 57,476.38H71Q75,476.38 75,480.38V519Z" fill="var(--s1)"><title>gautierdorval.com 1: 31</title></path><path d="M77,519V480.38Q77,476.38 81,476.38H95Q99,476.38 99,480.38V519Z" fill="var(--s2)"><title>pagup.com 1: 31</title></path><path d="M101,519V425.38Q101,421.38 105,421.38H119Q123,421.38 123,425.38V519Z" fill="var(--s3)"><title>better-robots.com 1: 71</title></path><text x="89" y="535" class="ax" text-anchor="middle">1 day</text><path d="M143,519V509.25Q143,505.25 147,505.25H161Q165,505.25 165,509.25V519Z" fill="var(--s1)"><title>gautierdorval.com 2-3: 10</title></path><path d="M167,519V509.25Q167,505.25 171,505.