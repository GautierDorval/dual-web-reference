<svg xmlns="http://www.w3.org/2000/svg" width="420" height="581" viewBox="0 0 420 581" role="img" aria-labelledby="title desc"><title id="title">Fenêtre observée et historique des révisions</title><desc id="desc">Une fenêtre, explicitement sans croissance ni tendance temporelle.</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6e69;--grid:#e1e0d9;--axis:#c9c8c1;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s5:#e87ba4;--s7:#6250d6;--neutral:#a3a29b;--neutral2:#d4d3cc;
--missing:#7a5c00;--band:#f3efe2}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a29b;
--grid:#2c2c2a;--axis:#4a4945;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s5:#d55181;--s7:#9085e9;
--neutral:#7d7c76;--neutral2:#4a4945;--missing:#e0b84a;--band:#2a2720}}
text{font-family:system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, &apos;Noto Sans&apos;, &apos;Liberation Sans&apos;, Arial, sans-serif;fill:var(--ink)}
.t{font-size:17px;font-weight:600}.st{font-size:13px;fill:var(--ink2)}.ax{font-size:12px;fill:var(--muted)}
.lb{font-size:12.5px;fill:var(--ink2)}.vl{font-size:12.5px;font-weight:600;fill:var(--ink)}
.ft{font-size:11.5px;fill:var(--muted)}.na{font-size:15px;font-weight:600;fill:var(--missing)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
</style><rect x="0" y="0" width="420" height="581" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Fenêtre observée et historique des</text><text x="20" y="52" class="t" text-anchor="start">révisions</text><text x="20" y="76" class="st" text-anchor="start">Une fenêtre observée est représentée ici. Une</text><text x="20" y="93" class="st" text-anchor="start">nouvelle révision des mêmes observations ne</text><text x="20" y="110" class="st" text-anchor="start">constitue pas une deuxième période et ne crée aucune</text><text x="20" y="127" class="st" text-anchor="start">croissance.</text><text x="20" y="174" class="t" text-anchor="start">245 requêtes GET 200</text><text x="20" y="204" class="lb" text-anchor="start">du 15 septembre au 14 octobre 2026 inclusivement, en</text><text x="20" y="220" class="lb" text-anchor="start">UTC</text><text x="20" y="244" class="lb" text-anchor="start">2026-09-15_2026-10-15-r2</text><text x="20" y="268" class="lb" text-anchor="start">Fenêtre suivante : du 15 octobre au 14 novembre 2026</text><text x="20" y="284" class="lb" text-anchor="start">inclusivement, en UTC (31 jours). Préparation et</text><text x="20" y="300" class="lb" text-anchor="start">disponibilité sont des états distincts.</text><text x="20" y="324" class="lb" text-anchor="start">Unité : requêtes ; population documentaire principale,</text><text x="20" y="340" class="lb" text-anchor="start">rôles IA à origine fournisseur. Aucune croissance sans</text><text x="20" y="356" class="lb" text-anchor="start">deuxième période dont la provenance, la durée, le</text><text x="20" y="372" class="lb" text-anchor="start">périmètre, les registres et la couverture sont</text><text x="20" y="388" class="lb" text-anchor="start">comparables.</text><line x1="20" y1="420" x2="400" y2="420" class="grid"/><text x="20" y="438" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r2. Données du 15 septembre</text><text x="20" y="453" class="ft" text-anchor="start">au 14 octobre 2026 inclusivement, en UTC (fin exclusive</text><text x="20" y="468" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="483" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à 22:58 UTC ;</text><text x="20" y="498" class="ft" text-anchor="start">couverture : rapports d’archive partiels déclarés 30 jours</text><text x="20" y="513" class="ft" text-anchor="start">sur 30.</text><text x="20" y="528" class="ft" text-anchor="start">Table source :</text><text x="20" y="543" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/metrics.json,</text><text x="20" y="558" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/catalog.json</text></svg>
