</style><rect x="0" y="0" width="960" height="743" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Ce que le résultat principal laisse de côté : volume HTTP par niveau d’identification, méthode</text><text x="20" y="52" class="t" text-anchor="start">et statut, et périmètre</text><text x="20" y="76" class="st" text-anchor="start">Du 15 septembre au 14 octobre 2026 inclusivement, en UTC.</text><text x="20" y="93" class="st" text-anchor="start">Figure secondaire. Les panneaux A et B couvrent la population documentaire principale, tous rôles confondus ; le panneau C</text><text x="20" y="110" class="st" text-anchor="start">couvre tout ce que le collecteur a enregistré. Unité : requêtes.</text><text x="20" y="137" class="vl" text-anchor="start">A. GET 200 par niveau d’identification enregistré</text><line x1="350" y1="145" x2="350" y2="261" class="grid"/><line x1="454" y1="145" x2="454" y2="261" class="grid"/><line x1="558" y1="145" x2="558" y2="261" class="grid"/><line x1="662" y1="145" x2="662" y2="261" class="grid"/><line x1="766" y1="145" x2="766" y2="261" class="grid"/><line x1="870" y1="145" x2="870" y2="261" class="grid"/><text x="342" y="162" class="lb" text-anchor="end">origine fournisseur, registre officiel</text><path d="M350,149H363.42Q367.42,149 367.42,153V163Q367.42,167 363.42,167H350Z" fill="var(--s1)"><title>origine fournisseur, registre officiel: 335</title></path><text x="373.42" y="162" class="vl" text-anchor="start">335</text><text x="342" y="190" class="lb" text-anchor="end">nom déclaré + signal réseau (en revue)</text><path d="M350,177H389Q393,177 393,181V191Q393,195 389,195H350Z" fill="var(--neutral)"><title>nom déclaré + signal réseau (en revue): 827</title></path><text x="399" y="190" class="vl" text-anchor="start">827</text><text x="342" y="218" class="lb" text-anchor="end">non attribué (en revue)</text><path d="M350,205H823.67Q827.67,205 827.67,209V219Q827.67,223 823.67,223H350Z" fill="var(--neutral)"><title>non attribu