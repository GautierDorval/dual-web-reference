292" class="vl" text-anchor="middle">P</text><text x="381" y="317" class="ax" text-anchor="middle">14</text><text x="20" y="341" class="lb" text-anchor="start">C: declared complete. P: declared partial. ?:</text><text x="20" y="357" class="lb" text-anchor="start">unavailable or unknown; details in the table.</text><text x="20" y="381" class="lb" text-anchor="start">Recorded classifier / epoch: 2026-08-24.1</text><text x="20" y="405" class="lb" text-anchor="start">Deployment labels from available evidence: pd01</text><text x="20" y="429" class="lb" text-anchor="start">Aggregate/V3 margins: withheld, not zero.</text><text x="20" y="453" class="lb" text-anchor="start">An intraday change without version on the aggregate</text><text x="20" y="469" class="lb" text-anchor="start">stays mixed_epoch_unresolved; it is never split</text><text x="20" y="485" class="lb" text-anchor="start">proportionally.</text><line x1="20" y1="517" x2="400" y2="517" class="grid"/><text x="20" y="535" class="ft" text-anchor="start">Edition 2026-09-15_2026-10-15-r2. Data September 15 to</text><text x="20" y="550" class="ft" text-anchor="start">October 14, 2026 inclusive, UTC (end exclusive</text><text x="20" y="565" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="580" class="ft" text-anchor="start">Extracted 2026-10-16 22:57 to 22:58 UTC; coverage: archive</text><text x="20" y="595" class="ft" text-anchor="start">reports partial (declared) on 30 of 30 days.</text><text x="20" y="610" class="ft" text-anchor="start">Source table:</text><text x="20" y="625" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/coverage.csv,</text><text x="20" y="640" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/catalog.json</text></svg>
