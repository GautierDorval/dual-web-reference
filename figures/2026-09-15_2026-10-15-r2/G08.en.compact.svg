<svg xmlns="http://www.w3.org/2000/svg" width="420" height="663" viewBox="0 0 420 663" role="img" aria-labelledby="title desc"><title id="title">Coverage and measurement provenance</title><desc id="desc">Daily coverage calendar with explicit partial, complete and unknown states, followed by recorded measurement versions.</desc><style>
