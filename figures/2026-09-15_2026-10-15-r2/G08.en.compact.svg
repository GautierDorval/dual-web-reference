</style><defs><pattern id="partial" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--band)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--missing)" stroke-width="1.5"/></pattern></defs><rect x="0" y="0" width="420" height="663" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Coverage and measurement provenance</text><text x="20" y="54" class="st" text-anchor="start">September 15 to October 14, 2026 inclusive, UTC.</text><text x="20" y="71" class="st" text-anchor="start">Unit: UTC days. Coverage comes from the archived</text><text x="20" y="88" class="st" text-anchor="start">report, not from agreement of counts. Count margins</text><text x="20" y="105" class="st" text-anchor="start">can be withheld without changing historical</text><text x="20" y="122" class="st" text-anchor="start">coverage.</text><rect x="21" y="149" width="36" height="36" fill="url(#partial)"><title>2026-09-15: partial_declared</title></rect><text x="39" y="172" class="vl" text-anchor="middle">P</text><text x="39" y="197" class="ax" text-anchor="middle">15</text><rect x="59" y="149" width="36" height="36" fill="url(#partial)"><title>2026-09-16: partial_declared</title></rect><text x="77" y="172" class="vl" text-anchor="middle">P</text><text x="77" y="197" class="ax" text-anchor="middle">16</text><rect x="97" y="149" width="36" height="36" fill="url(#partial)"><title>2026-09-17: partial_declared</title></rect><text x="115" y="172" class="vl" text-anchor="middle">P</text><text x="115" y="197" class="ax" text-anchor="middle">17</text><rect x="135" y="149" width="36" height="36" fill="url(#partial)"><title>2026-09-18: partial_declared</title></rect><text x="153" y="172" class="vl" text-anchor="middle">P</text><text x="153" y="197" class="ax" text-anchor="middle">18</text><rect x="173" y="149" width="36" height="36" fill="url(#partial)"><title>2026-09-19: partial_declared</title></rect><text x="191" y="17