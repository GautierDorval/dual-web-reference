ct><path d="M20,797H20Q20.28,797 20.28,797.28V814.72Q20.28,815 20,815H20Z" fill="var(--neutral)"><title>POST 405: 18</title></path><text x="219" y="810" class="vl" text-anchor="start">18</text><text x="20" y="847" class="vl" text-anchor="start">C. All requests recorded by the</text><text x="20" y="863" class="vl" text-anchor="start">collector, by population</text><text x="20" y="904" class="lb" text-anchor="start">main documentary population</text><rect x="20" y="911" width="193" height="18" fill="var(--band)"></rect><path d="M20,911H198.45Q202.45,911 202.45,915V925Q202.45,929 198.45,929H20Z" fill="var(--neutral)"><title>main documentary population: 14180</title></path><text x="219" y="924" class="vl" text-anchor="start">14,180</text><text x="20" y="962" class="lb" text-anchor="start">other documentary files</text><text x="20" y="978" class="lb" text-anchor="start">(supporting, descriptors,</text><text x="20" y="994" class="lb" text-anchor="start">technical)</text><rect x="20" y="1001" width="193" height="18" fill="var(--band)"></rect><path d="M20,1001H85.57Q89.57,1001 89.57,1005V1015Q89.57,1019 85.57,1019H20Z" fill="var(--neutral)"><title>other documentary files (supporting, descriptors, technical): 5407</title></path><text x="219" y="1014" class="vl" text-anchor="start">5,407</text><text x="20" y="1052" class="lb" text-anchor="start">robots.txt (control)</text><rect x="20" y="1059" width="193" height="18" fill="var(--band)"></rect><path d="M20,1059H69.62Q73.62,1059 73.62,1063V1073Q73.62,1077 69.62,1077H20Z" fill="var(--neutral)"><title>robots.txt (control): 4167</title></path><text x="219" y="1072" class="vl" text-anchor="start">4,167</text><text x="20" y="1110" class="lb" text-anchor="start">undeclared well-known bucket</text><rect x="20" y="1117" width="193" height="18" fill="var(--band)"></rect><path d="M20,1117H29.65Q33.65,1117 33.65,1121V1131Q33.65,1135 29.65,1135H20Z" fill="var(--neutral)"><title>undeclared well-known bucket: 1061</title></path><text x="219" y="1130" class="vl" text-anchor="start">1,061</text><text x="20" y="1169" class="ax" text-anchor="start">HEAD, 304, 3xx and 4xx responses are</text><text x="20" y="1184" class="ax" text-anchor="start">not successful document bodies.</text><text x="20" y="1199" class="ax" text-anchor="start">Unattributed and network-claimed</text><text x="20" y="1214" class="ax" text-anchor="start">levels depend on a Cloudflare</text><text x="20" y="1229" class="ax" text-anchor="start">predicate under review.</text><line x1="20" y1="1252" x2="268" y2="1252" class="grid"/><text x="20" y="1270" class="ft" text-anchor="start">Edition 2026-09-15_2026-10-15-r2. Data</text><text x="20" y="1285" class="ft" text-anchor="start">September 15 to October 14, 2026</text><text x="20" y="1300" class="ft" text-anchor="start">inclusive, UTC (end exclusive</text><text x="20" y="1315" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="1330" class="ft" text-anchor="start">Extracted 2026-10-16 22:57 to 22:58</text><text x="20" y="1345" class="ft" text-anchor="start">UTC; coverage: archive reports partial</text><text x="20" y="1360" class="ft" text-anchor="start">(declared) on 30 of 30 days.</text><text x="20" y="1375" class="ft" text-anchor="start">Source table:</text><text x="20" y="1390" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1405" class="ft" text-anchor="start">/consultations.csv,</text><text x="20" y="1420" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1435" class="ft" text-anchor="start">/resources.csv,</text><text x="20" y="1450" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1465" class="ft" text-anchor="start">/daily-summary.csv</text></svg>
