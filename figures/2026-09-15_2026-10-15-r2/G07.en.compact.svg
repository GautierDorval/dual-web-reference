</style><rect x="0" y="0" width="420" height="1176" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">What the main result leaves out: HTTP</text><text x="20" y="52" class="t" text-anchor="start">volume by identification level, method</text><text x="20" y="74" class="t" text-anchor="start">and status, and perimeter</text><text x="20" y="98" class="st" text-anchor="start">September 15 to October 14, 2026 inclusive, UTC.</text><text x="20" y="115" class="st" text-anchor="start">Secondary figure. Panels A and B cover the main</text><text x="20" y="132" class="st" text-anchor="start">documentary population, all roles; panel C covers</text><text x="20" y="149" class="st" text-anchor="start">everything the collector recorded. Unit: requests.</text><text x="20" y="176" class="vl" text-anchor="start">A. GET 200 by stored identification level</text><text x="20" y="201" class="lb" text-anchor="start">provider origin, registry match</text><rect x="20" y="208" width="325" height="18" fill="var(--band)"></rect><path d="M20,208H26.89Q30.89,208 30.89,212V222Q30.89,226 26.89,226H20Z" fill="var(--s1)"><title>provider origin, registry match: 335</title></path><text x="351" y="221" class="vl" text-anchor="start">335</text><text x="20" y="259" class="lb" text-anchor="start">declared name + network signal (under review)</text><rect x="20" y="266" width="325" height="18" fill="var(--band)"></rect><path d="M20,266H42.88Q46.88,266 46.88,270V280Q46.88,284 42.88,284H20Z" fill="var(--neutral)"><title>declared name + network signal (under review): 827</title></path><text x="351" y="279" class="vl" text-anchor="start">827</text><text x="20" y="317" class="lb" text-anchor="start">unattributed (under review)</text><rect x="20" y="324" width="325" height="18" fill="var(--band)"></rect><path d="M20,324H314.55Q318.55,324 318.55,328V338Q318.55,342 314.55,342H20Z" fill="var(--neutral)"><title>unattributed (under review): 9186</title></path><text x="351" y="337" class="vl" text-anchor="start">9,186</text><text x="20" y="375" class="lb" text-anchor="start">failed verification</text><rect x="20" y="382" width="325" height="18" fill="var(--band)"></rect><path d="M20,382H20Q20.59,382 20.59,382.58V399.42Q20.59,400 20,400H20Z" fill="var(--neutral)"><title>failed verification: 18</title></path><text x="351" y="395" class="vl" text-anchor="start">18</text><text x="20" y="432" class="vl" text-anchor="start">B. Requests by method and status</text><text x="20" y="457" class="lb" text-anchor="start">GET 200</text><rect x="20" y="464" width="325" height="18" fill="var(--band)"></rect><path d="M20,464H285.52Q289.52,464 289.52,468V478Q289.52,482 285.52,482H20Z" fill="var(--s7)"><title>GET 200: 10366</title></path><text x="351" y="477" class="vl" text-anchor="start">10,366</text><text x="20" y="515" class="lb" text-anchor="start">HEAD 200</text><rect x="20" y="522" width="325" height="18" fill="var(--band)"></rect><path d="M20,522H103.28Q107.28,522 107.28,526V536Q107.28,540 103.28,540H20Z" fill="var(--neutral)"><title>HEAD 200: 3357</title></path><text x="351" y="535" class="vl" text-anchor="start">3,357</text><text x="20" y="573" class="lb" text-anchor="start">GET 304</text><rect x="20" y="580" width="325" height="18" fill="var(--band)"></rect><path d="M20,580H27.41Q31.41,580 31.41,584V594Q31.41,598 27.41,598H20Z" fill="var(--neutral)"><title>GET 304: 439</title></path><text x="351" y="593" class="vl" text-anchor="start">439</text><text x="20" y="631" class="lb" text-anchor="start">POST 405</text><rect x="20" y="638" width="325" height="18" fill="var(--band)"></rect><path d="M20,638H20Q20.47,638 20.47,638.47V655.53Q20.47,656 20,656H20Z" fill="var(--neutral)"><title>POST 405: 18</title></path><text x="351" y="651" class="vl" text-anchor="start">18</text><text x="20" y="688" class="vl" text-anchor="start">C. All requests recorded by the collector, by population</text><text x="20" y="713" class="lb" text-anchor="start">main documentary population</text><rect x="20" y="720" width="325" height="18" fill="var(--band)"></rect><path d="M20,720H323.23Q327.23,720 327.23,724V734Q327.23,738 323.23,738H20Z" fill="var(--neutral)"><title>main documentary population: 14180</title></path><text x="351" y="733" class="vl" text-anchor="start">14,180</text><text x="20" y="771" class="lb" text-anchor="start">other documentary files (supporting, descriptors,</text><text x="20" y="787" class="lb" text-anchor="start">technical)</text><rect x="20" y="794" width="325" height="18" fill="var(--band)"></rect><path d="M20,794H133.15Q137.15,794 137.15,798V808Q137.15,812 133.15,812H20Z" fill="var(--neutral)"><title>other documentary files (supporting, descriptors, technical): 5407</title></path><text x="351" y="807" class="vl" text-anchor="start">5,407</text><text x="20" y="845" class="lb" text-anchor="start">robots.txt (control)</text><rect x="20" y="852" width="325" height="18" fill="var(--band)"></rect><path d="M20,852H106.28Q110.28,852 110.28,856V866Q110.28,870 106.28,870H20Z" fill="var(--neutral)"><title>robots.txt (control): 4167</title></path><text x="351" y="865" class="vl" text-anchor="start">4,167</text><text x="20" y="903" class="lb" text-anchor="start">undeclared well-known bucket</text><rect x="20" y="910" width="325" height="18" fill="var(--band)"></rect><path d="M20,910H38.99Q42.99,910 42.99,914V924Q42.99,928 38.99,928H20Z" fill="var(--neutral)"><title>undeclared well-known bucket: 1061</title></path><text x="351" y="923" class="vl" text-anchor="start">1,061</text><text x="20" y="962" class="ax" text-anchor="start">HEAD, 304, 3xx and 4xx responses are not successful</text><text x="20" y="977" class="ax" text-anchor="start">document bodies. Unattributed and network-claimed levels</text><text x="20" y="992" class="ax" text-anchor="start">depend on a Cloudflare predicate under review.</text><line x1="20" y1="1015" x2="400" y2="1015" class="grid"/><text x="20" y="1033" class="ft" text-anchor="start">Edition 2026-09-15_2026-10-15-r2. Data September 15 to</text><text x="20" y="1048" class="ft" text-anchor="start">October 14, 2026 inclusive, UTC (end exclusive</text><text x="20" y="1063" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="1078" class="ft" text-anchor="start">Extracted 2026-10-16 22:57 to 22:58 UTC; coverage: archive</text><text x="20" y="1093" class="ft" text-anchor="start">reports partial (declared) on 30 of 30 days.</text><text x="20" y="1108" class="ft" text-anchor="start">Source table:</text><text x="20" y="1123" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/consultations.csv,</text><text x="20" y="1138" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/resources.csv,</text><text x="20" y="1153" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/daily-summary.csv</text></svg>
