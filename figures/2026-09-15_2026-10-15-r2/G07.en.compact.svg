<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1176" viewBox="0 0 420 1176" role="img" aria-labelledby="title desc"><title id="title">What the main result leaves out: HTTP volume by identification level, method and status, and perimeter</title><desc id="desc">Three horizontal bar panels: GET 200 of the main population by identification level, its requests by method and status, and all collector requests by population.</desc><style>
