</style><rect x="0" y="0" width="288" height="1488" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">What the main result</text><text x="20" y="52" class="t" text-anchor="start">leaves out: HTTP volume by</text><text x="20" y="74" class="t" text-anchor="start">identification level,</text><text x="20" y="96" class="t" text-anchor="start">method and status, and</text><text x="20" y="118" class="t" text-anchor="start">perimeter</text><text x="20" y="142" class="st" text-anchor="start">September 15 to October 14, 2026</text><text x="20" y="159" class="st" text-anchor="start">inclusive, UTC.</text><text x="20" y="176" class="st" text-anchor="start">Secondary figure. Panels A and B</text><text x="20" y="193" class="st" text-anchor="start">cover the main documentary</text><text x="20" y="210" class="st" text-anchor="start">population, all roles; panel C</text><text x="20" y="227" class="st" text-anchor="start">covers everything the collector</text><text x="20" y="244" class="st" text-anchor="start">recorded. Unit: requests.</text><text x="20" y="271" class="vl" text-anchor="start">A. GET 200 by stored identification</text><text x="20" y="287" class="vl" text-anchor="start">level</text><text x="20" y="328" class="lb" text-anchor="start">provider origin, registry match</text><rect x="20" y="335" width="193" height="18" fill="var(--band)"></rect><path d="M20,335H22.47Q26.47,335 26.47,339V349Q26.47,353 22.47,353H20Z" fill="var(--s1)"><title>provider origin, registry match: 335</title></path><text x="219" y="348" class="vl" text-anchor="start">335</text><text x="20" y="386" class="lb" text-anchor="start">declared name + network signal</text><text x="20" y="402" class="lb" text-anchor="start">(under review)</text><rect x="20" y="409" width="193" height="18" fill="var(--band)"></rect><path d="M20,409H31.96Q35.96,409 35.96,413V423Q35.96,427 31.96,427H20Z" fill="var(--neutral)"><title>declared name + network signal (under review): 827</title></path><text x="