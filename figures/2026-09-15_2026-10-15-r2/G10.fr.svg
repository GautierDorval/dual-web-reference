<svg xmlns="http://www.w3.org/2000/svg" width="960" height="355" viewBox="0 0 960 355" role="img" aria-labelledby="title desc"><title id="title">Fenêtre observée et historique des révisions</title><desc id="desc">Une fenêtre, explicitement sans croissance ni tendance temporelle.</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6e69;--grid:#e1e0d9;--axis:#c9c8c1;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s5:#e87ba4;--s7:#6250d6;--neutral:#a3a29b;--neutral2:#d4d3cc;
--missing:#7a5c00;--band:#f3efe2}
