</style><rect x="0" y="0" width="960" height="355" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Fenêtre observée et historique des révisions</text><text x="20" y="54" class="st" text-anchor="start">Une fenêtre observée est représentée ici. Une nouvelle révision des mêmes observations ne constitue pas une deuxième période</text><text x="20" y="71" class="st" text-anchor="start">et ne crée aucune croissance.</text><text x="20" y="118" class="t" text-anchor="start">245 requêtes GET 200</text><text x="20" y="148" class="lb" text-anchor="start">du 15 septembre au 14 octobre 2026 inclusivement, en UTC</text><text x="20" y="172" class="lb" text-anchor="start">2026-09-15_2026-10-15-r2</text><text x="20" y="196" class="lb" text-anchor="start">Fenêtre suivante : du 15 octobre au 14 novembre 2026 inclusivement, en UTC (31 jours). Préparation et disponibilité sont des états</text><text x="20" y="212" class="lb" text-anchor="start">distincts.</text><text x="20" y="236" class="lb" text-anchor="start">Unité : requêtes ; population documentaire principale, rôles IA à origine fournisseur. Aucune croissance sans deuxième période dont</text><text x="20" y="252" class="lb" text-anchor="start">la provenance, la durée, le périmètre, les registres et la couverture sont comparables.</text><line x1="20" y1="284" x2="940" y2="284" class="grid"/><text x="20" y="302" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r2. Données du 15 septembre au 14 octobre 2026 inclusivement, en UTC (fin exclusive 2026-10-15T00:00:00Z).</text><text x="20" y="317" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à 22:58 UTC ; couverture : rapports d’archive partiels déclarés 30 jours sur 30.</text><text x="20" y="332" class="ft" text-anchor="start">Table source : data/editions/2026-09-15_2026-10-15-r2/metrics.json, data/editions/2026-09-15_2026-10-15-r2/catalog.json</text></svg>
