</style><rect x="0" y="0" width="960" height="339" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Observed window and revision history</text><text x="20" y="54" class="st" text-anchor="start">One observed window is represented here. A new revision of the same observations is not a second period and never creates</text><text x="20" y="71" class="st" text-anchor="start">growth.</text><text x="20" y="118" class="t" text-anchor="start">245 GET 200 requests</text><text x="20" y="148" class="lb" text-anchor="start">September 15 to October 14, 2026 inclusive, UTC</text><text x="20" y="172" class="lb" text-anchor="start">2026-09-15_2026-10-15-r2</text><text x="20" y="196" class="lb" text-anchor="start">Next window: October 15 to November 14, 2026 inclusive, UTC (31 days). Preparation and availability are separate states.</text><text x="20" y="220" class="lb" text-anchor="start">Unit: requests; main documentary population, provider-origin AI roles. No growth is calculated without a second period whose</text><text x="20" y="236" class="lb" text-anchor="start">provenance, duration, scope, registries and coverage are comparable.</text><line x1="20" y1="268" x2="940" y2="268" class="grid"/><text x="20" y="286" class="ft" text-anchor="start">Edition 2026-09-15_2026-10-15-r2. Data September 15 to October 14, 2026 inclusive, UTC (end exclusive 2026-10-15T00:00:00Z).</text><text x="20" y="301" class="ft" text-anchor="start">Extracted 2026-10-16 22:57 to 22:58 UTC; coverage: archive reports partial (declared) on 30 of 30 days.</text><text x="20" y="316" class="ft" text-anchor="start">Source table: data/editions/2026-09-15_2026-10-15-r2/metrics.json, data/editions/2026-09-15_2026-10-15-r2/catalog.json</text></svg>
