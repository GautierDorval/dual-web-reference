</style><rect x="0" y="0" width="288" height="1311" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Actors, roles and provider</text><text x="20" y="52" class="t" text-anchor="start">families</text><text x="20" y="76" class="st" text-anchor="start">September 15 to October 14, 2026</text><text x="20" y="93" class="st" text-anchor="start">inclusive, UTC.</text><text x="20" y="110" class="st" text-anchor="start">Main documentary population; GET</text><text x="20" y="127" class="st" text-anchor="start">200; provider-origin registry</text><text x="20" y="144" class="st" text-anchor="start">match. Unit: requests. Software</text><text x="20" y="161" class="st" text-anchor="start">agents, not unique people.</text><text x="20" y="178" class="st" text-anchor="start">User-initiated fetches remain</text><text x="20" y="195" class="st" text-anchor="start">separate.</text><text x="20" y="222" class="vl" text-anchor="start">A. Named agents</text><text x="20" y="249" class="lb" text-anchor="start">GPTBot</text><rect x="20" y="256" width="193" height="18" fill="var(--band)"></rect><path d="M20,256H209Q213,256 213,260V270Q213,274 209,274H20Z" fill="var(--s1)"><title>GPTBot: 200</title></path><text x="219" y="269" class="vl" text-anchor="start">200</text><text x="20" y="294" class="ax" text-anchor="start">81.6%</text><text x="20" y="322" class="lb" text-anchor="start">PerplexityBot</text><rect x="20" y="329" width="193" height="18" fill="var(--band)"></rect><path d="M20,329H31.44Q35.44,329 35.44,333V343Q35.44,347 31.44,347H20Z" fill="var(--s1)"><title>PerplexityBot: 16</title></path><text x="219" y="342" class="vl" text-anchor="start">16</text><text x="20" y="367" class="ax" text-anchor="start">6.5%</text><text x="20" y="395" class="lb" text-anchor="start">ChatGPT-User</text><rect x="20" y="402" width="193" height="18" fill="var(--band)"></rect><path d="M20,402H30.48Q34.48,402 34.48,406V416Q34.48,420 30.48,420H20Z" fill="var(--s1)"><title>ChatGPT-User: 15</title></path><text x="219" y="415" class="vl" text-anchor="start">15</text><text x="20" y="440" class="ax" text-anchor="start">6.1%</text><text x="20" y="468" class="lb" text-anchor="start">OAI-SearchBot</text><rect x="20" y="475" width="193" height="18" fill="var(--band)"></rect><path d="M20,475H29.51Q33.51,475 33.51,479V489Q33.51,493 29.51,493H20Z" fill="var(--s1)"><title>OAI-SearchBot: 14</title></path><text x="219" y="488" class="vl" text-anchor="start">14</text><text x="20" y="513" class="ax" text-anchor="start">5.7%</text><text x="20" y="546" class="vl" text-anchor="start">B. Provider families</text><text x="20" y="573" class="lb" text-anchor="start">openai</text><rect x="20" y="580" width="193" height="18" fill="var(--band)"></rect><path d="M20,580H192.79Q196.79,580 196.79,584V594Q196.79,598 192.79,598H20Z" fill="var(--s1)"><title>openai: 229</title></path><text x="219" y="593" class="vl" text-anchor="start">229</text><text x="20" y="618" class="ax" text-anchor="start">93.5%</text><text x="20" y="646" class="lb" text-anchor="start">perplexity</text><rect x="20" y="653" width="193" height="18" fill="var(--band)"></rect><path d="M20,653H28.35Q32.35,653 32.35,657V667Q32.35,671 28.35,671H20Z" fill="var(--s1)"><title>perplexity: 16</title></path><text x="219" y="666" class="vl" text-anchor="start">16</text><text x="20" y="691" class="ax" text-anchor="start">6.5%</text><text x="20" y="724" class="vl" text-anchor="start">C. Distinct roles</text><text x="20" y="751" class="lb" text-anchor="start">collection for training</text><text x="20" y="767" class="lb" text-anchor="start">(ai_training)</text><rect x="20" y="774" width="193" height="18" fill="var(--band)"></rect><path d="M20,774H209Q213,774 213,778V788Q213,792 209,792H20Z" fill="var(--s7)"><title>collection for training (ai_training): 200</title></path><text x="219" y="787" class="vl" text-anchor="start">200</text><text x="20" y="825" class="lb" text-anchor="start">AI search (ai_search)</text><rect x="20" y="832" width="193" height="18" fill="var(--band)"></rect><path d="M20,832H44.95Q48.95,832 48.95,836V846Q48.95,850 44.95,850H20Z" fill="var(--s7)"><title>AI search (ai_search): 30</title></path><text x="219" y="845" class="vl" text-anchor="start">30</text><text x="20" y="883" class="lb" text-anchor="start">user-initiated fetch</text><text x="20" y="899" class="lb" text-anchor="start">(user_initiated_fetch)</text><rect x="20" y="906" width="193" height="18" fill="var(--band)"></rect><path d="M20,906H30.48Q34.48,906 34.48,910V920Q34.48,924 30.48,924H20Z" fill="var(--s7)"><title>user-initiated fetch (user_initiated_fetch): 15</title></path><text x="219" y="919" class="vl" text-anchor="start">15</text><text x="20" y="962" class="ax" text-anchor="start">Separate failed-origin selection: 17</text><text x="20" y="977" class="ax" text-anchor="start">of 262 GET 200, for the same four</text><text x="20" y="992" class="ax" text-anchor="start">recorded names only. This is not</text><text x="20" y="1007" class="ax" text-anchor="start">demonstrated spoofing and is not</text><text x="20" y="1022" class="ax" text-anchor="start">added to the verified-origin result.</text><text x="20" y="1037" class="ax" text-anchor="start">Historical-scope roles remain in</text><text x="20" y="1052" class="ax" text-anchor="start">metrics.json.</text><line x1="20" y1="1075" x2="268" y2="1075" class="grid"/><text x="20" y="1093" class="ft" text-anchor="start">Edition 2026-09-15_2026-10-15-r2. Data</text><text x="20" y="1108" class="ft" text-anchor="start">September 15 to October 14, 2026</text><text x="20" y="1123" class="ft" text-anchor="start">inclusive, UTC (end exclusive</text><text x="20" y="1138" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="1153" class="ft" text-anchor="start">Extracted 2026-10-16 22:57 to 22:58</text><text x="20" y="1168" class="ft" text-anchor="start">UTC; coverage: archive reports partial</text><text x="20" y="1183" class="ft" text-anchor="start">(declared) on 30 of 30 days.</text><text x="20" y="1198" class="ft" text-anchor="start">Source table:</text><text x="20" y="1213" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1228" class="ft" text-anchor="start">/metrics.json,</text><text x="20" y="1243" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1258" class="ft" text-anchor="start">/consultations.csv,</text><text x="20" y="1273" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1288" class="ft" text-anchor="start">/resources.csv</text></svg>
