<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1101" viewBox="0 0 420 1101" role="img" aria-labelledby="title desc"><title id="title">Actors, roles and provider families</title><desc id="desc">Three panels separate named actors, provider families and roles; failed-origin counts are contextual, not added.</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6e69;--grid:#e1e0d9;--axis:#c9c8c1;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s5:#e87ba4;--s7:#6250d6;--neutral:#a3a29b;--neutral2:#d4d3cc;
