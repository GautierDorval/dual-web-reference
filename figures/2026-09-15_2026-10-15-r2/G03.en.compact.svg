</style><rect x="0" y="0" width="420" height="1101" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Actors, roles and provider families</text><text x="20" y="54" class="st" text-anchor="start">September 15 to October 14, 2026 inclusive, UTC.</text><text x="20" y="71" class="st" text-anchor="start">Main documentary population; GET 200;</text><text x="20" y="88" class="st" text-anchor="start">provider-origin registry match. Unit: requests.</text><text x="20" y="105" class="st" text-anchor="start">Software agents, not unique people. User-initiated</text><text x="20" y="122" class="st" text-anchor="start">fetches remain separate.</text><text x="20" y="149" class="vl" text-anchor="start">A. Named agents</text><text x="20" y="176" class="lb" text-anchor="start">GPTBot</text><rect x="20" y="183" width="325" height="18" fill="var(--band)"></rect><path d="M20,183H341Q345,183 345,187V197Q345,201 341,201H20Z" fill="var(--s1)"><title>GPTBot: 200</title></path><text x="351" y="196" class="vl" text-anchor="start">200</text><text x="20" y="221" class="ax" text-anchor="start">81.6%</text><text x="20" y="249" class="lb" text-anchor="start">PerplexityBot</text><rect x="20" y="256" width="325" height="18" fill="var(--band)"></rect><path d="M20,256H42Q46,256 46,260V270Q46,274 42,274H20Z" fill="var(--s1)"><title>PerplexityBot: 16</title></path><text x="351" y="269" class="vl" text-anchor="start">16</text><text x="20" y="294" class="ax" text-anchor="start">6.5%</text><text x="20" y="322" class="lb" text-anchor="start">ChatGPT-User</text><rect x="20" y="329" width="325" height="18" fill="var(--band)"></rect><path d="M20,329H40.38Q44.38,329 44.38,333V343Q44.38,347 40.38,347H20Z" fill="var(--s1)"><title>ChatGPT-User: 15</title></path><text x="351" y="342" class="vl" text-anchor="start">15</text><text x="20" y="367" class="ax" text-anchor="start">6.1%</text><text x="20" y="395" class="lb" text-anchor="start">OAI-SearchBot</text><rect x="20" y="402" width="325" height="18" fill="var(--band)"></rect><path d="M20,402H38.75Q42.75,402 42.75,406V416Q42.75,420 38.75,420H20Z" fill="var(--s1)"><title>OAI-SearchBot: 14</title></path><text x="351" y="415" class="vl" text-anchor="start">14</text><text x="20" y="440" class="ax" text-anchor="start">5.7%</text><text x="20" y="473" class="vl" text-anchor="start">B. Provider families</text><text x="20" y="500" class="lb" text-anchor="start">openai</text><rect x="20" y="507" width="325" height="18" fill="var(--band)"></rect><path d="M20,507H313.7Q317.7,507 317.7,511V521Q317.7,525 313.7,525H20Z" fill="var(--s1)"><title>openai: 229</title></path><text x="351" y="520" class="vl" text-anchor="start">229</text><text x="20" y="545" class="ax" text-anchor="start">93.5%</text><text x="20" y="573" class="lb" text-anchor="start">perplexity</text><rect x="20" y="580" width="325" height="18" fill="var(--band)"></rect><path d="M20,580H36.8Q40.8,580 40.8,584V594Q40.8,598 36.8,598H20Z" fill="var(--s1)"><title>perplexity: 16</title></path><text x="351" y="593" class="vl" text-anchor="start">16</text><text x="20" y="618" class="ax" text-anchor="start">6.5%</text><text x="20" y="651" class="vl" text-anchor="start">C. Distinct roles</text><text x="20" y="678" class="lb" text-anchor="start">collection for training (ai_training)</text><rect x="20" y="685" width="325" height="18" fill="var(--band)"></rect><path d="M20,685H341Q345,685 345,689V699Q345,703 341,703H20Z" fill="var(--s7)"><title>collection for training (ai_training): 200</title></path><text x="351" y="698" class="vl" text-anchor="start">200</text><text x="20" y="736" class="lb" text-anchor="start">AI search (ai_search)</text><rect x="20" y="743" width="325" height="18" fill="var(--band)"></rect><path d="M20,743H64.75Q68.75,743 68.75,747V757Q68.75,761 64.75,761H20Z" fill="var(--s7)"><title>AI search (ai_search): 30</title></path><text x="351" y="756" class="vl" text-anchor="start">30</text><text x="20" y="794" class="lb" text-anchor="start">user-initiated fetch (user_initiated_fetch)</text><rect x="20" y="801" width="325" height="18" fill="var(--band)"></rect><path d="M20,801H40.38Q44.38,801 44.38,805V815Q44.38,819 40.38,819H20Z" fill="var(--s7)"><title>user-initiated fetch (user_initiated_fetch): 15</title></path><text x="351" y="814" class="vl" text-anchor="start">15</text><text x="20" y="857" class="ax" text-anchor="start">Separate failed-origin selection: 17 of 262 GET 200, for</text><text x="20" y="872" class="ax" text-anchor="start">the same four recorded names only. This is not</text><text x="20" y="887" class="ax" text-anchor="start">demonstrated spoofing and is not added to the</text><text x="20" y="902" class="ax" text-anchor="start">verified-origin result. Historical-scope roles remain in</text><text x="20" y="917" class="ax" text-anchor="start">metrics.json.</text><line x1="20" y1="940" x2="400" y2="940" class="grid"/><text x="20" y="958" class="ft" text-anchor="start">Edition 2026-09-15_2026-10-15-r2. Data September 15 to</text><text x="20" y="973" class="ft" text-anchor="start">October 14, 2026 inclusive, UTC (end exclusive</text><text x="20" y="988" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="1003" class="ft" text-anchor="start">Extracted 2026-10-16 22:57 to 22:58 UTC; coverage: archive</text><text x="20" y="1018" class="ft" text-anchor="start">reports partial (declared) on 30 of 30 days.</text><text x="20" y="1033" class="ft" text-anchor="start">Source table:</text><text x="20" y="1048" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/metrics.json,</text><text x="20" y="1063" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/consultations.csv,</text><text x="20" y="1078" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/resources.csv</text></svg>
