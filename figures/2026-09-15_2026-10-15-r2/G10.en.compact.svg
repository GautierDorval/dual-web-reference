<svg xmlns="http://www.w3.org/2000/svg" width="288" height="674" viewBox="0 0 288 674" role="img" aria-labelledby="title desc"><title id="title">Observed window and revision history</title><desc id="desc">One window, explicitly no temporal growth or trend.</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6e69;--grid:#e1e0d9;--axis:#c9c8c1;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s5:#e87ba4;--s7:#6250d6;--neutral:#a3a29b;--neutral2:#d4d3cc;
--missing:#7a5c00;--band:#f3efe2}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a29b;
--grid:#2c2c2a;--axis:#4a4945;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s5:#d55181;--s7:#9085e9;
--neutral:#7d7c76;--neutral2:#4a4945;--missing:#e0b84a;--band:#2a2720}}
text{font-family:system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, &apos;Noto Sans&apos;, &apos;Liberation Sans&apos;, Arial, sans-serif;fill:var(--ink)}
.t{font-size:17px;font-weight:600}.st{font-size:13px;fill:var(--ink2)}.ax{font-size:12px;fill:var(--muted)}
.lb{font-size:12.5px;fill:var(--ink2)}.vl{font-size:12.5px;font-weight:600;fill:var(--ink)}
.ft{font-size:11.5px;fill:var(--muted)}.na{font-size:15px;font-weight:600;fill:var(--missing)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
</style><rect x="0" y="0" width="288" height="674" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Observed window and</text><text x="20" y="52" class="t" text-anchor="start">revision history</text><text x="20" y="76" class="st" text-anchor="start">One observed window is represented</text><text x="20" y="93" class="st" text-anchor="start">here. A new revision of the same</text><text x="20" y="110" class="st" text-anchor="start">observations is not a second</text><text x="20" y="127" class="st" text-anchor="start">period and never creates growth.</text><text x="20" y="174" class="t" text-anchor="start">245 GET 200 requests</text><text x="20" y="204" class="lb" text-anchor="start">September 15 to October 14, 2026</text><text x="20" y="220" class="lb" text-anchor="start">inclusive, UTC</text><text x="20" y="244" class="lb" text-anchor="start">2026-09-15_2026-10-15-r2</text><text x="20" y="268" class="lb" text-anchor="start">Next window: October 15 to November</text><text x="20" y="284" class="lb" text-anchor="start">14, 2026 inclusive, UTC (31 days).</text><text x="20" y="300" class="lb" text-anchor="start">Preparation and availability are</text><text x="20" y="316" class="lb" text-anchor="start">separate states.</text><text x="20" y="340" class="lb" text-anchor="start">Unit: requests; main documentary</text><text x="20" y="356" class="lb" text-anchor="start">population, provider-origin AI</text><text x="20" y="372" class="lb" text-anchor="start">roles. No growth is calculated</text><text x="20" y="388" class="lb" text-anchor="start">without a second period whose</text><text x="20" y="404" class="lb" text-anchor="start">provenance, duration, scope,</text><text x="20" y="420" class="lb" text-anchor="start">registries and coverage are</text><text x="20" y="436" class="lb" text-anchor="start">comparable.</text><line x1="20" y1="468" x2="268" y2="468" class="grid"/><text x="20" y="486" class="ft" text-anchor="start">Edition 2026-09-15_2026-10-15-r2. Data</text><text x="20" y="501" class="ft" text-anchor="start">September 15 to October 14, 2026</text><text x="20" y="516" class="ft" text-anchor="start">inclusive, UTC (end exclusive</text><text x="20" y="531" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="546" class="ft" text-anchor="start">Extracted 2026-10-16 22:57 to 22:58</text><text x="20" y="561" class="ft" text-anchor="start">UTC; coverage: archive reports partial</text><text x="20" y="576" class="ft" text-anchor="start">(declared) on 30 of 30 days.</text><text x="20" y="591" class="ft" text-anchor="start">Source table:</text><text x="20" y="606" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="621" class="ft" text-anchor="start">/metrics.json,</text><text x="20" y="636" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="651" class="ft" text-anchor="start">/catalog.json</text></svg>
