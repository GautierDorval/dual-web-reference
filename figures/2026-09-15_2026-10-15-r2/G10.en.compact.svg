<svg xmlns="http://www.w3.org/2000/svg" width="420" height="495" viewBox="0 0 420 495" role="img" aria-labelledby="title desc"><title id="title">Observed window and revision history</title><desc id="desc">One window, explicitly no temporal growth or trend.</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6e69;--grid:#e1e0d9;--axis:#c9c8c1;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s5:#e87ba4;--s7:#6250d6;--neutral:#a3a29b;--neutral2:#d4d3cc;
--missing:#7a5c00;--band:#f3efe2}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a29b;
--grid:#2c2c2a;--axis:#4a4945;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s5:#d55181;--s7:#9085e9;
--neutral:#7d7c76;--neutral2:#4a4945;--missing:#e0b84a;--band:#2a2720}}
text{font-family:system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, &apos;Noto Sans&apos;, &apos;Liberation Sans&apos;, Arial, sans-serif;fill:var(--ink)}
.t{font-size:17px;font-weight:600}.st{font-size:13px;fill:var(--ink2)}.ax{font-size:12px;fill:var(--muted)}
.lb{font-size:12.5px;fill:var(--ink2)}.vl{font-size:12.5px;font-weight:600;fill:var(--ink)}
.ft{font-size:11.5px;fill:var(--muted)}.na{font-size:15px;font-weight:600;fill:var(--missing)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
</style><rect x="0" y="0" width="420" height="495" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Observed window and revision history</text><text x="20" y="54" class="st" text-anchor="start">One observed window is represented here. A new</text><text x="20" y="71" class="st" text-anchor="start">revision of the same observations is not a second</text><text x="20" y="88" class="st" text-anchor="start">period and never creates growth.</text><text x="20" y="135" class="t" text-anchor="start">245 GET 200 requests</text><text x="20" y="165" class="lb" text-anchor="start">September 15 to October 14, 2026 inclusive, UTC</text><text x="20" y="189" class="lb" text-anchor="start">2026-09-15_2026-10-15-r2</text><text x="20" y="213" class="lb" text-anchor="start">Next window: October 15 to November 14, 2026</text><text x="20" y="229" class="lb" text-anchor="start">inclusive, UTC (31 days). Preparation and availability</text><text x="20" y="245" class="lb" text-anchor="start">are separate states.</text><text x="20" y="269" class="lb" text-anchor="start">Unit: requests; main documentary population,</text><text x="20" y="285" class="lb" text-anchor="start">provider-origin AI roles. No growth is calculated</text><text x="20" y="301" class="lb" text-anchor="start">without a second period whose provenance, duration,</text><text x="20" y="317" class="lb" text-anchor="start">scope, registries and coverage are comparable.</text><line x1="20" y1="349" x2="400" y2="349" class="grid"/><text x="20" y="367" class="ft" text-anchor="start">Edition 2026-09-15_2026-10-15-r2. Data September 15 to</text><text x="20" y="382" class="ft" text-anchor="start">October 14, 2026 inclusive, UTC (end exclusive</text><text x="20" y="397" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="412" class="ft" text-anchor="start">Extracted 2026-10-16 22:57 to 22:58 UTC; coverage: archive</text><text x="20" y="427" class="ft" text-anchor="start">reports partial (declared) on 30 of 30 days.</text><text x="20" y="442" class="ft" text-anchor="start">Source table:</text><text x="20" y="457" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/metrics.json,</text><text x="20" y="472" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/catalog.json</text></svg>
