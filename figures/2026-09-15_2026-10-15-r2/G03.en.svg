</style><rect x="0" y="0" width="960" height="659" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Actors, roles and provider families</text><text x="20" y="54" class="st" text-anchor="start">September 15 to October 14, 2026 inclusive, UTC.</text><text x="20" y="71" class="st" text-anchor="start">Main documentary population; GET 200; provider-origin registry match. Unit: requests. Software agents, not unique people.</text><text x="20" y="88" class="st" text-anchor="start">User-initiated fetches remain separate.</text><text x="20" y="115" class="vl" text-anchor="start">A. Named agents</text><line x1="260" y1="125" x2="260" y2="241" class="grid"/><line x1="412.5" y1="125" x2="412.5" y2="241" class="grid"/><line x1="565" y1="125" x2="565" y2="241" class="grid"/><line x1="717.5" y1="125" x2="717.5" y2="241" class="grid"/><line x1="870" y1="125" x2="870" y2="241" class="grid"/><text x="252" y="142" class="lb" text-anchor="end">GPTBot</text><path d="M260,129H866Q870,129 870,133V143Q870,147 866,147H260Z" fill="var(--s1)"><title>GPTBot: 200</title></path><text x="876" y="142" class="vl" text-anchor="start">200 81.6%</text><text x="252" y="170" class="lb" text-anchor="end">PerplexityBot</text><path d="M260,157H304.8Q308.8,157 308.8,161V171Q308.8,175 304.8,175H260Z" fill="var(--s1)"><title>PerplexityBot: 16</title></path><text x="314.8" y="170" class="vl" text-anchor="start">16 6.5%</text><text x="252" y="198" class="lb" text-anchor="end">ChatGPT-User</text><path d="M260,185H301.75Q305.75,185 305.75,189V199Q305.75,203 301.75,203H260Z" fill="var(--s1)"><title>ChatGPT-User: 15</title></path><text x="311.75" y="198" class="vl" text-anchor="start">15 6.1%</text><text x="252" y="226" class="lb" text-anchor="end">OAI-SearchBot</text><path d="M260,213H298.7Q302.7,213 302.7,217V227Q302.7,231 298.7,231H260Z" fill="var(--s1)"><title>OAI-SearchBot: 14</title></path><text x="308.7" y="226" class="vl" text-anchor="start">14 5.7%</text><text x="260" y="253" class="ax" text-anchor="middle">0</text><text x="412.5" y="253" class="ax" text-anchor="middle">50</text><text x="565" y="253" class="ax" text-anchor="middle">100</text><text x="717.5" y="253" class="ax" text-anchor="middle">150</text><text x="870" y="253" class="ax" text-anchor="middle">200</text><text x="20" y="283" class="vl" text-anchor="start">B. Provider families</text><line x1="260" y1="293" x2="260" y2="353" class="grid"/><line x1="382" y1="293" x2="382" y2="353" class="grid"/><line x1="504" y1="293" x2="504" y2="353" class="grid"/><line x1="626" y1="293" x2="626" y2="353" class="grid"/><line x1="748" y1="293" x2="748" y2="353" class="grid"/><line x1="870" y1="293" x2="870" y2="353" class="grid"/><text x="252" y="310" class="lb" text-anchor="end">openai</text><path d="M260,297H814.76Q818.76,297 818.76,301V311Q818.76,315 814.76,315H260Z" fill="var(--s1)"><title>openai: 229</title></path><text x="824.76" y="310" class="vl" text-anchor="start">229 93.5%</text><text x="252" y="338" class="lb" text-anchor="end">perplexity</text><path d="M260,325H295.04Q299.04,325 299.04,329V339Q299.04,343 295.04,343H260Z" fill="var(--s1)"><title>perplexity: 16</title></path><text x="305.04" y="338" class="vl" text-anchor="start">16 6.5%</text><text x="260" y="365" class="ax" text-anchor="middle">0</text><text x="382" y="365" class="ax" text-anchor="middle">50</text><text x="504" y="365" class="ax" text-anchor="middle">100</text><text x="626" y="365" class="ax" text-anchor="middle">150</text><text x="748" y="365" class="ax" text-anchor="middle">200</text><text x="870" y="365" class="ax" text-anchor="middle">250</text><text x="20" y="395" class="vl" text-anchor="start">C. Distinct roles</text><line x1="350" y1="405" x2="350" y2="493" class="grid"/><line x1="480" y1="405" x2="480" y2="493" class="grid"/><line x1="610" y1="405" x2="610" y2="493" class="grid"/><line x1="740" y1="405" x2="740" y2="493" class="grid"/><line x1="870" y1="405" x2="870" y2="493" class="grid"/><text x="342" y="422" class="lb" text-anchor="end">collection for training (ai_training)</text><path d="M350,409H866Q870,409 870,413V423Q870,427 866,427H350Z" fill="var(--s7)"><title>collection for training (ai_training): 200</title></path><text x="876" y="422" class="vl" text-anchor="start">200</text><text x="342" y="450" class="lb" text-anchor="end">AI search (ai_search)</text><path d="M350,437H424Q428,437 428,441V451Q428,455 424,455H350Z" fill="var(--s7)"><title>AI search (ai_search): 30</title></path><text x="434" y="450" class="vl" text-anchor="start">30</text><text x="342" y="478" class="lb" text-anchor="end">user-initiated fetch (user_initiated_fetch)</text><path d="M350,465H385Q389,465 389,469V479Q389,483 385,483H350Z" fill="var(--s7)"><title>user-initiated fetch (user_initiated_fetch): 15</title></path><text x="395" y="478" class="vl" text-anchor="start">15</text><text x="350" y="505" class="ax" text-anchor="middle">0</text><text x="480" y="505" class="ax" text-anchor="middle">50</text><text x="610" y="505" class="ax" text-anchor="middle">100</text><text x="740" y="505" class="ax" text-anchor="middle">150</text><text x="870" y="505" class="ax" text-anchor="middle">200</text><text x="20" y="535" class="ax" text-anchor="start">Separate failed-origin selection: 17 of 262 GET 200, for the same four recorded names only. This is not demonstrated spoofing and is not</text><text x="20" y="550" class="ax" text-anchor="start">added to the verified-origin result. Historical-scope roles remain in metrics.json.</text><line x1="20" y1="573" x2="940" y2="573" class="grid"/><text x="20" y="591" class="ft" text-anchor="start">Edition 2026-09-15_2026-10-15-r2. Data September 15 to October 14, 2026 inclusive, UTC (end exclusive 2026-10-15T00:00:00Z).</text><text x="20" y="606" class="ft" text-anchor="start">Extracted 2026-10-16 22:57 to 22:58 UTC; coverage: archive reports partial (declared) on 30 of 30 days.</text><text x="20" y="621" class="ft" text-anchor="start">Source table: data/editions/20