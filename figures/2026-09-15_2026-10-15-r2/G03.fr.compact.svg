</style><rect x="0" y="0" width="288" height="1373" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Acteurs, rôles et familles</text><text x="20" y="52" class="t" text-anchor="start">de fournisseurs</text><text x="20" y="76" class="st" text-anchor="start">Du 15 septembre au 14 octobre 2026</text><text x="20" y="93" class="st" text-anchor="start">inclusivement, en UTC.</text><text x="20" y="110" class="st" text-anchor="start">Population documentaire</text><text x="20" y="127" class="st" text-anchor="start">principale ; GET 200 ; origine</text><text x="20" y="144" class="st" text-anchor="start">fournisseur rapprochée du</text><text x="20" y="161" class="st" text-anchor="start">registre. Unité : requêtes. Agents</text><text x="20" y="178" class="st" text-anchor="start">logiciels, pas des personnes</text><text x="20" y="195" class="st" text-anchor="start">uniques. Les récupérations à la</text><text x="20" y="212" class="st" text-anchor="start">demande restent distinctes.</text><text x="20" y="239" class="vl" text-anchor="start">A. Agents nommés</text><text x="20" y="266" class="lb" text-anchor="start">GPTBot</text><rect x="20" y="273" width="193" height="18" fill="var(--band)"></rect><path d="M20,273H209Q213,273 213,277V287Q213,291 209,291H20Z" fill="var(--s1)"><title>GPTBot: 200</title></path><text x="219" y="286" class="vl" text-anchor="start">200</text><text x="20" y="311" class="ax" text-anchor="start">81.6 %</text><text x="20" y="339" class="lb" text-anchor="start">PerplexityBot</text><rect x="20" y="346" width="193" height="18" fill="var(--band)"></rect><path d="M20,346H31.44Q35.44,346 35.44,350V360Q35.44,364 31.44,364H20Z" fill="var(--s1)"><title>PerplexityBot: 16</title></path><text x="219" y="359" class="vl" text-anchor="start">16</text><text x="20" y="384" class="ax" text-anchor="start">6.5 %</text><text x="20" y="412" class="lb" text-anchor="start">ChatGPT-User</text><rect x="20" y="419" width="193" height="18" fill="var(--band)"></rect><path d="M20,419H30.48Q34.48,419 34.48,423V433Q34.48,437 30.48,437H20Z" fill="var(--s1)"><title>ChatGPT-User: 15</title></path><text x="219" y="432" class="vl" text-anchor="start">15</text><text x="20" y="457" class="ax" text-anchor="start">6.1 %</text><text x="20" y="485" class="lb" text-anchor="start">OAI-SearchBot</text><rect x="20" y="492" width="193" height="18" fill="var(--band)"></rect><path d="M20,492H29.51Q33.51,492 33.51,496V506Q33.51,510 29.51,510H20Z" fill="var(--s1)"><title>OAI-SearchBot: 14</title></path><text x="219" y="505" class="vl" text-anchor="start">14</text><text x="20" y="530" class="ax" text-anchor="start">5.7 %</text><text x="20" y="563" class="vl" text-anchor="start">B. Familles de fournisseurs</text><text x="20" y="590" class="lb" text-anchor="start">openai</text><rect x="20" y="597" width="193" height="18" fill="var(--band)"></rect><path d="M20,597H192.79Q196.79,597 196.79,601V611Q196.79,615 192.79,615H20Z" fill="var(--s1)"><title>openai: 229</title></path><text x="219" y="610" class="vl" text-anchor="start">229</text><text x="20" y="635" class="ax" text-anchor="start">93.5 %</text><text x="20" y="663" class="lb" text-anchor="start">perplexity</text><rect x="20" y="670" width="193" height="18" fill="var(--band)"></rect><path d="M20,670H28.35Q32.35,670 32.35,674V684Q32.35,688 28.35,688H20Z" fill="var(--s1)"><title>perplexity: 16</title></path><text x="219" y="683" class="vl" text-anchor="start">16</text><text x="20" y="708" class="ax" text-anchor="start">6.5 %</text><text x="20" y="741" class="vl" text-anchor="start">C. Rôles distincts</text><text x="20" y="768" class="lb" text-anchor="start">collecte pour entraînement</text><text x="20" y="784" class="lb" text-anchor="start">(ai_training)</text><rect x="20" y="791" width="193" height="18" fill="var(--band)"></rect><path d="M20,791H209Q213,791 213,795V805Q213,809 209,809H20Z" fill="var(--s7)"><title>collecte pour entraînement (ai_training): 200</title></path><text x="219" y="804" class="vl" text-anchor="start">200</text><text x="20" y="842" class="lb" text-anchor="start">recherche IA (ai_search)</text><rect x="20" y="849" width="193" height="18" fill="var(--band)"></rect><path d="M20,849H44.95Q48.95,849 48.95,853V863Q48.95,867 44.95,867H20Z" fill="var(--s7)"><title>recherche IA (ai_search): 30</title></path><text x="219" y="862" class="vl" text-anchor="start">30</text><text x="20" y="900" class="lb" text-anchor="start">récupération à la demande</text><text x="20" y="916" class="lb" text-anchor="start">(user_initiated_fetch)</text><rect x="20" y="923" width="193" height="18" fill="var(--band)"></rect><path d="M20,923H30.48Q34.48,923 34.48,927V937Q34.48,941 30.48,941H20Z" fill="var(--s7)"><title>récupération à la demande (user_initiated_fetch): 15</title></path><text x="219" y="936" class="vl" text-anchor="start">15</text><text x="20" y="979" class="ax" text-anchor="start">Sélection distincte d’origine non</text><text x="20" y="994" class="ax" text-anchor="start">vérifiée : 17 GET 200 sur 262, pour</text><text x="20" y="1009" class="ax" text-anchor="start">les quatre mêmes noms enregistrés</text><text x="20" y="1024" class="ax" text-anchor="start">seulement. Ce n’est pas une</text><text x="20" y="1039" class="ax" text-anchor="start">usurpation démontrée et ce compte</text><text x="20" y="1054" class="ax" text-anchor="start">n’est pas ajouté au résultat à</text><text x="20" y="1069" class="ax" text-anchor="start">origine vérifiée. Les rôles du</text><text x="20" y="1084" class="ax" text-anchor="start">périmètre historique restent dans</text><text x="20" y="1099" class="ax" text-anchor="start">metrics.json.</text><line x1="20" y1="1122" x2="268" y2="1122" class="grid"/><text x="20" y="1140" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r2.</text><text x="20" y="1155" class="ft" text-anchor="start">Données du 15 septembre au 14 octobre</text><text x="20" y="1170" class="ft" text-anchor="start">2026 inclusivement, en UTC (fin</text><text x="20" y="1185" class="ft" text-anchor="start">exclusive 2026-10-15T00:00:00Z).</text><text x="20" y="1200" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à</text><text x="20" y="1215" class="ft" text-anchor="start">22:58 UTC ; couverture : rapports</text><text x="20" y="1230" class="ft" text-anchor="start">d’archive partiels déclarés 30 jours</text><text x="20" y="1245" class="ft" text-anchor="start">sur 30.</text><text x="20" y="1260" class="ft" text-anchor="start">Table source :</text><text x="20" y="1275" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1290" class="ft" text-anchor="start">/metrics.json,</text><text x="20" y="1305" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1320" class="ft" text-anchor="start">/consultations.csv,</text><text x="20" y="1335" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1350" class="ft" text-anchor="start">/resources.csv</text></svg>
