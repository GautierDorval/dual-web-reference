<svg xmlns="http://www.w3.org/2000/svg" width="288" height="1373" viewBox="0 0 288 1373" role="img" aria-labelledby="title desc"><title id="title">Acteurs, rôles et familles de fournisseurs</title><desc id="desc">Trois panneaux séparent acteurs nommés, familles de fournisseurs et rôles ; les origines non vérifiées restent un contexte distinct.</desc><style>
