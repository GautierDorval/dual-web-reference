<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1187" viewBox="0 0 420 1187" role="img" aria-labelledby="title desc"><title id="title">Acteurs, rôles et familles de fournisseurs</title><desc id="desc">Trois panneaux séparent acteurs nommés, familles de fournisseurs et rôles ; les origines non vérifiées restent un contexte distinct.</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6e69;--grid:#e1e0d9;--axis:#c9c8c1;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s5:#e87ba4;--s7:#6250d6;--neutral:#a3a29b;--neutral2:#d4d3cc;
--missing:#7a5c00;--band:#f3efe2}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a29b;
--grid:#2c2c2a;--axis:#4a4945;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s5:#d55181;--s7:#9085e9;
--neutral:#7d7c76;--neutral2:#4a4945;--missing:#e0b84a;--band:#2a2720}}
text{font-family:system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, &apos;Noto Sans&apos;, &apos;Liberation Sans&apos;, Arial, sans-serif;fill:var(--ink)}
.t{font-size:17px;font-weight:600}.st{font-size:13px;fill:var(--ink2)}.ax{font-size:12px;fill:var(--muted)}
.lb{font-size:12.5px;fill:var(--ink2)}.vl{font-size:12.5px;font-weight:600;fill:var(--ink)}
.ft{font-size:11.5px;fill:var(--muted)}.na{font-size:15px;font-weight:600;fill:var(--missing)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
</style><rect x="0" y="0" width="420" height="1187" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Acteurs, rôles et familles de</text><text x="20" y="52" class="t" text-anchor="start">fournisseurs</text><text x="20" y="76" class="st" text-anchor="start">Du 15 septembre au 14 octobre 2026 inclusivement, en</text><text x="20" y="93" class="st" text-anchor="start">UTC.</text><text x="20" y="110" class="st" text-anchor="start">Population documentaire principale ; GET 200 ;</text><text x="20" y="127" class="st" text-anchor="start">origine fournisseur rapprochée du registre. Unité :</text><text x="20" y="144" class="st" text-anchor="start">requêtes. Agents logiciels, pas des personnes</text><text x="20" y="161" class="st" text-anchor="start">uniques. Les récupérations à la demande restent</text><text x="20" y="178" class="st" text-anchor="start">distinctes.</text><text x="20" y="205" class="vl" text-anchor="start">A. Agents nommés</text><text x="20" y="232" class="lb" text-anchor="start">GPTBot</text><rect x="20" y="239" width="325" height="18" fill="var(--band)"></rect><path d="M20,239H341Q345,239 345,243V253Q345,257 341,257H20Z" fill="var(--s1)"><title>GPTBot: 200</title></path><text x="351" y="252" class="vl" text-anchor="start">200</text><text x="20" y="277" class="ax" text-anchor="start">81.6 %</text><text x="20" y="305" class="lb" text-anchor="start">PerplexityBot</text><rect x="20" y="312" width="325" height="18" fill="var(--band)"></rect><path d="M20,312H42Q46,312 46,316V326Q46,330 42,330H20Z" fill="var(--s1)"><title>PerplexityBot: 16</title></path><text x="351" y="325" class="vl" text-anchor="start">16</text><text x="20" y="350" class="ax" text-anchor="start">6.5 %</text><text x="20" y="378" class="lb" text-anchor="start">ChatGPT-User</text><rect x="20" y="385" width="325" height="18" fill="var(--band)"></rect><path d="M20,385H40.38Q44.38,385 44.38,389V399Q44.38,403 40.38,403H20Z" fill="var(--s1)"><title>ChatGPT-User: 15</title></path><text x="351" y="398" class="vl" text-anchor="start">15</text><text x="20" y="423" class="ax" text-anchor="start">6.1 %</text><text x="20" y="451" class="lb" text-anchor="start">OAI-SearchBot</text><rect x="20" y="458" width="325" height="18" fill="var(--band)"></rect><path d="M20,458H38.75Q42.75,458 42.75,462V472Q42.75,476 38.75,476H20Z" fill="var(--s1)"><title>OAI-SearchBot: 14</title></path><text x="351" y="471" class="vl" text-anchor="start">14</text><text x="20" y="496" class="ax" text-anchor="start">5.7 %</text><text x="20" y="529" class="vl" text-anchor="start">B. Familles de fournisseurs</text><text x="20" y="556" class="lb" text-anchor="start">openai</text><rect x="20" y="563" width="325" height="18" fill="var(--band)"></rect><path d="M20,563H313.7Q317.7,563 317.7,567V577Q317.7,581 313.7,581H20Z" fill="var(--s1)"><title>openai: 229</title></path><text x="351" y="576" class="vl" text-anchor="start">229</text><text x="20" y="601" class="ax" text-anchor="start">93.5 %</text><text x="20" y="629" class="lb" text-anchor="start">perplexity</text><rect x="20" y="636" width="325" height="18" fill="var(--band)"></rect><path d="M20,636H36.8Q40.8,636 40.8,640V650Q40.8,654 36.8,654H20Z" fill="var(--s1)"><title>perplexity: 16</title></path><text x="351" y="649" class="vl" text-anchor="start">16</text><text x="20" y="674" class="ax" text-anchor="start">6.5 %</text><text x="20" y="707" class="vl" text-anchor="start">C. Rôles distincts</text><text x="20" y="734" class="lb" text-anchor="start">collecte pour entraînement (ai_training)</text><rect x="20" y="741" width="325" height="18" fill="var(--band)"></rect><path d="M20,741H341Q345,741 345,745V755Q345,759 341,759H20Z" fill="var(--s7)"><title>collecte pour entraînement (ai_training): 200</title></path><text x="351" y="754" class="vl" text-anchor="start">200</text><text x="20" y="792" class="lb" text-anchor="start">recherche IA (ai_search)</text><rect x="20" y="799" width="325" height="18" fill="var(--band)"></rect><path d="M20,799H64.75Q68.75,799 68.75,803V813Q68.75,817 64.75,817H20Z" fill="var(--s7)"><title>recherche IA (ai_search): 30</title></path><text x="351" y="812" class="vl" text-anchor="start">30</text><text x="20" y="850" class="lb" text-anchor="start">récupération à la demande (user_initiated_fetch)</text><rect x="20" y="857" width="325" height="18" fill="var(--band)"></rect><path d="M20,857H40.38Q44.38,857 44.38,861V871Q44.38,875 40.38,875H20Z" fill="var(--s7)"><title>récupération à la demande (user_initiated_fetch): 15</title></path><text x="351" y="870" class="vl" text-anchor="start">15</text><text x="20" y="913" class="ax" text-anchor="start">Sélection distincte d’origine non vérifiée : 17 GET 200</text><text x="20" y="928" class="ax" text-anchor="start">sur 262, pour les quatre mêmes noms enregistrés</text><text x="20" y="943" class="ax" text-anchor="start">seulement. Ce n’est pas une usurpation démontrée et ce</text><text x="20" y="958" class="ax" text-anchor="start">compte n’est pas ajouté au résultat à origine vérifiée.</text><text x="20" y="973" class="ax" text-anchor="start">Les rôles du périmètre historique restent dans</text><text x="20" y="988" class="ax" text-anchor="start">metrics.json.</text><line x1="20" y1="1011" x2="400" y2="1011" class="grid"/><text x="20" y="1029" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r2. Données du 15 septembre</text><text x="20" y="1044" class="ft" text-anchor="start">au 14 octobre 2026 inclusivement, en UTC (fin exclusive</text><text x="20" y="1059" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="1074" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à 22:58 UTC ;</text><text x="20" y="1089" class="ft" text-anchor="start">couverture : rapports d’archive partiels déclarés 30 jours</text><text x="20" y="1104" class="ft" text-anchor="start">sur 30.</text><text x="20" y="1119" class="ft" text-anchor="start">Table source :</text><text x="20" y="1134" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/metrics.json,</text><text x="20" y="1149" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/consultations.csv,</text><text x="20" y="1164" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/resources.csv</text></svg>
