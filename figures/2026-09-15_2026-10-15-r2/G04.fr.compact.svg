</style><rect x="0" y="0" width="288" height="1107" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Couples site-chemin</text><text x="20" y="52" class="t" text-anchor="start">distincts demandés, et</text><text x="20" y="74" class="t" text-anchor="start">récurrence</text><text x="20" y="98" class="st" text-anchor="start">Du 15 septembre au 14 octobre 2026</text><text x="20" y="115" class="st" text-anchor="start">inclusivement, en UTC.</text><text x="20" y="132" class="st" text-anchor="start">Unité : couples site-chemin (URL),</text><text x="20" y="149" class="st" text-anchor="start">pas des consommateurs. Les</text><text x="20" y="166" class="st" text-anchor="start">distincts sont calculés sur les</text><text x="20" y="183" class="st" text-anchor="start">couples, jamais en additionnant</text><text x="20" y="200" class="st" text-anchor="start">des comptes par acteur.</text><text x="20" y="227" class="vl" text-anchor="start">A. Population documentaire</text><text x="20" y="243" class="vl" text-anchor="start">principale : couples avec lignes</text><text x="20" y="259" class="vl" text-anchor="start">dans la fenêtre, et couples avec au</text><text x="20" y="275" class="vl" text-anchor="start">moins un GET 200 IA à origine</text><text x="20" y="291" class="vl" text-anchor="start">fournisseur</text><text x="20" y="321" class="lb" text-anchor="start">gautierdorval.com</text><rect x="20" y="331" width="130.33" height="16" fill="var(--neutral2)"><title>gautierdorval.com: 113 pairs with rows</title></rect><path d="M20,335H65.59Q69.59,335 69.59,339V339Q69.59,343 65.59,343H20Z" fill="var(--s1)"><title>gautierdorval.com: 43 pairs with provider-origin AI GET 200</title></path><text x="156.33" y="343" class="vl" text-anchor="start">43 sur 113</text><text x="20" y="383" class="lb" text-anchor="start">pagup.com</text><rect x="20" y="393" width="70.35" height="16" fill="var(--neutral2)"><title>pagup.com: 61 pairs with rows</title></rect><path d="M20,397H63.29Q67.29,397 67.29,401V401Q67.29,405 63.29,405H20Z" fill="var(--s2)"><title>pagup.com: 41 pairs with provider-origin AI GET 200</title></path><text x="96.35" y="405" class="vl" text-anchor="start">41 sur 61</text><text x="20" y="445" class="lb" text-anchor="start">better-robots.com</text><rect x="20" y="455" width="109.57" height="16" fill="var(--neutral2)"><title>better-robots.com: 95 pairs with rows</title></rect><path d="M20,459H119.8Q123.8,459 123.8,463V463Q123.8,467 119.8,467H20Z" fill="var(--s3)"><title>better-robots.com: 90 pairs with provider-origin AI GET 200</title></path><text x="135.57" y="467" class="vl" text-anchor="start">90 sur 95</text><text x="20" y="497" class="ax" text-anchor="start">Barre grise large : couples avec</text><text x="20" y="512" class="ax" text-anchor="start">lignes (toutes classifications</text><text x="20" y="527" class="ax" text-anchor="start">enregistrées). Barre fine : couples</text><text x="20" y="542" class="ax" text-anchor="start">avec au moins un GET 200 IA à</text><text x="20" y="557" class="ax" text-anchor="start">origine fournisseur.</text><text x="20" y="582" class="vl" text-anchor="start">B. Récurrence : nombre de jours UTC</text><text x="20" y="598" class="vl" text-anchor="start">avec au moins un GET 200 IA à</text><text x="20" y="614" class="vl" text-anchor="start">origine fournisseur, par couple</text><text x="20" y="630" class="vl" text-anchor="start">demandé</text><line x1="40" y1="770" x2="268" y2="770" class="grid"/><text x="36" y="774" class="ax" text-anchor="end">0</text><line x1="40" y1="742.5" x2="268" y2="742.5" class="grid"/><text x="36" y="746.5" class="ax" text-anchor="end">20</text><line x1="40" y1="715" x2="268" y2="715" class="grid"/><text x="36" y="719" class="ax" text-anchor="end">40</text><line x1="40" y1="687.5" x2="268" y2="687.5" class="grid"/><text x="36" y="691.5" class="ax" text-anchor="end">60</text><line x1="40" y1="660" x2="268" y2="660" class="grid"/><text x="36" y="664" class="ax" text-anch