ass="axis"/><circle cx="25" cy="800" r="5" fill="var(--s1)"/><text x="34" y="804" class="lb" text-anchor="start">gautierdorval.com</text><circle cx="25" cy="818" r="5" fill="var(--s2)"/><text x="34" y="822" class="lb" text-anchor="start">pagup.com</text><circle cx="122.0" cy="818" r="5" fill="var(--s3)"/><text x="131" y="822" class="lb" text-anchor="start">better-robots.com</text><line x1="20" y1="856" x2="268" y2="856" class="grid"/><text x="20" y="874" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r2.</text><text x="20" y="889" class="ft" text-anchor="start">Données du 15 septembre au 14 octobre</text><text x="20" y="904" class="ft" text-anchor="start">2026 inclusivement, en UTC (fin</text><text x="20" y="919" class="ft" text-anchor="start">exclusive 2026-10-15T00:00:00Z).</text><text x="20" y="934" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à</text><text x="20" y="949" class="ft" text-anchor="start">22:58 UTC ; couverture : rapports</text><text x="20" y="964" class="ft" text-anchor="start">d’archive partiels déclarés 30 jours</text><text x="20" y="979" class="ft" text-anchor="start">sur 30.</text><text x="20" y="994" class="ft" text-anchor="start">Table source :</text><text x="20" y="1009" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1024" class="ft" text-anchor="start">/resources.csv,</text><text x="20" y="1039" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1054" class="ft" text-anchor="start">/consultations.csv,</text><text x="20" y="1069" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1084" class="ft" text-anchor="start">/resource-summary.csv</text></svg>
