<svg xmlns="http://www.w3.org/2000/svg" width="288" height="1567" viewBox="0 0 288 1567" role="img" aria-labelledby="title desc"><title id="title">Ce que le résultat principal laisse de côté : volume HTTP par niveau d’identification, méthode et statut, et périmètre</title><desc id="desc">Trois panneaux de barres horizontales : GET 200 de la population principale par niveau d’identification, ses requêtes par méthode et statut, et toutes les requêtes du collecteur par population.</desc><style>
