</style><rect x="0" y="0" width="288" height="1567" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Ce que le résultat</text><text x="20" y="52" class="t" text-anchor="start">principal laisse de côté :</text><text x="20" y="74" class="t" text-anchor="start">volume HTTP par niveau</text><text x="20" y="96" class="t" text-anchor="start">d’identification, méthode</text><text x="20" y="118" class="t" text-anchor="start">et statut, et périmètre</text><text x="20" y="142" class="st" text-anchor="start">Du 15 septembre au 14 octobre 2026</text><text x="20" y="159" class="st" text-anchor="start">inclusivement, en UTC.</text><text x="20" y="176" class="st" text-anchor="start">Figure secondaire. Les panneaux A</text><text x="20" y="193" class="st" text-anchor="start">et B couvrent la population</text><text x="20" y="210" class="st" text-anchor="start">documentaire principale, tous</text><text x="20" y="227" class="st" text-anchor="start">rôles confondus ; le panneau C</text><text x="20" y="244" class="st" text-anchor="start">couvre tout ce que le collecteur a</text><text x="20" y="261" class="st" text-anchor="start">enregistré. Unité : requêtes.</text><text x="20" y="288" class="vl" text-anchor="start">A. GET 200 par niveau</text><text x="20" y="304" class="vl" text-anchor="start">d’identification enregistré</text><text x="20" y="345" class="lb" text-anchor="start">origine fournisseur, registre</text><text x="20" y="361" class="lb" text-anchor="start">officiel</text><rect x="20" y="368" width="193" height="18" fill="var(--band)"></rect><path d="M20,368H22.47Q26.47,368 26.47,372V382Q26.47,386 22.47,386H20Z" fill="var(--s1)"><title>origine fournisseur, registre officiel: 335</title></path><text x="219" y="381" class="vl" text-anchor="start">335</text><text x="20" y="419" class="lb" text-anchor="start">nom déclaré + signal réseau (en</text><text x="20" y="435" class="lb" text-anchor="start">revue)</text><rect x="20" y="442" width="193" height="18" fill="var(--band)"></rect><path d="M20,442H31.96Q35.96,442 35.96,446V456Q35.96,460 31.96,460H20Z" fill="var(--neutral)"><title>nom déclaré + signal réseau (en revue): 827</title></path><text x="219" y="455" class="vl" text-anchor="start">827</text><text x="20" y="493" class="lb" text-anchor="start">non attribué (en revue)</text><rect x="20" y="500" width="193" height="18" fill="var(--band)"></rect><path d="M20,500H193.29Q197.29,500 197.29,504V514Q197.29,518 193.29,518H20Z" fill="var(--neutral)"><title>non attribué (en revue): 9186</title></path><text x="219" y="513" class="vl" text-anchor="start">9 186</text><text x="20" y="551" class="lb" text-anchor="start">vérification échouée</text><rect x="20" y="558" width="193" height="18" fill="var(--band)"></rect><path d="M20,558H20Q20.35,558 20.35,558.35V575.65Q20.35,576 20,576H20Z" fill="var(--neutral)"><title>vérification échouée: 18</title></path><text x="219" y="571" class="vl" text-anchor="start">18</text><text x="20" y="608" class="vl" text-anchor="start">B. Requêtes par méthode et statut</text><text x="20" y="649" class="lb" text-anchor="start">GET 200</text><rect x="20" y="656" width="193" height="18" fill="var(--band)"></rect><path d="M20,656H176.05Q180.05,656 180.05,660V670Q180.05,674 176.05,674H20Z" fill="var(--s7)"><title>GET 200: 10366</title></path><text x="219" y="669" class="vl" text-anchor="start">10 366</text><text x="20" y="707" class="lb" text-anchor="start">HEAD 200</text><rect x="20" y="714" width="193" height="18" fill="var(--band)"></rect><path d="M20,714H67.83Q71.83,714 71.83,718V728Q71.83,732 67.83,732H20Z" fill="var(--neutral)"><title>HEAD 200: 3357</title></path><text x="219" y="727" class="vl" text-anchor="start">3 357</text><text x="20" y="765" class="lb" text-anchor="start">GET 304</text><rect x="20" y="772" width="193" height="18" fill="var(--band)"></rect><path d="M20,772H22.78Q26.78,772 26.78,776V786Q26.78,790 22.78,790H20Z" fill="var(--neutral)"><title>GET 304: 439</title></path><text x="219" y