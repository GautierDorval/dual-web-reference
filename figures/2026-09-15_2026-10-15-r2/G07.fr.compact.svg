start">déclaré</text><rect x="20" y="1166" width="193" height="18" fill="var(--band)"></rect><path d="M20,1166H29.65Q33.65,1166 33.65,1170V1180Q33.65,1184 29.65,1184H20Z" fill="var(--neutral)"><title>compartiment well-known non déclaré: 1061</title></path><text x="219" y="1179" class="vl" text-anchor="start">1 061</text><text x="20" y="1218" class="ax" text-anchor="start">Les réponses HEAD, 304, 3xx et 4xx</text><text x="20" y="1233" class="ax" text-anchor="start">ne sont pas des corps de documents</text><text x="20" y="1248" class="ax" text-anchor="start">récupérés avec succès. Les niveaux</text><text x="20" y="1263" class="ax" text-anchor="start">non attribué et réseau déclaré</text><text x="20" y="1278" class="ax" text-anchor="start">dépendent d’un prédicat Cloudflare</text><text x="20" y="1293" class="ax" text-anchor="start">en revue.</text><line x1="20" y1="1316" x2="268" y2="1316" class="grid"/><text x="20" y="1334" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r2.</text><text x="20" y="1349" class="ft" text-anchor="start">Données du 15 septembre au 14 octobre</text><text x="20" y="1364" class="ft" text-anchor="start">2026 inclusivement, en UTC (fin</text><text x="20" y="1379" class="ft" text-anchor="start">exclusive 2026-10-15T00:00:00Z).</text><text x="20" y="1394" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à</text><text x="20" y="1409" class="ft" text-anchor="start">22:58 UTC ; couverture : rapports</text><text x="20" y="1424" class="ft" text-anchor="start">d’archive partiels déclarés 30 jours</text><text x="20" y="1439" class="ft" text-anchor="start">sur 30.</text><text x="20" y="1454" class="ft" text-anchor="start">Table source :</text><text x="20" y="1469" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" y="1484" class="ft" text-anchor="start">/consultations.csv,</text><text x="20" y="1499" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2</text><text x="20" 