</style><rect x="0" y="0" width="420" height="1246" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Ce que le résultat principal laisse de</text><text x="20" y="52" class="t" text-anchor="start">côté : volume HTTP par niveau</text><text x="20" y="74" class="t" text-anchor="start">d’identification, méthode et statut, et</text><text x="20" y="96" class="t" text-anchor="start">périmètre</text><text x="20" y="120" class="st" text-anchor="start">Du 15 septembre au 14 octobre 2026 inclusivement, en</text><text x="20" y="137" class="st" text-anchor="start">UTC.</text><text x="20" y="154" class="st" text-anchor="start">Figure secondaire. Les panneaux A et B couvrent la</text><text x="20" y="171" class="st" text-anchor="start">population documentaire principale, tous rôles</text><text x="20" y="188" class="st" text-anchor="start">confondus ; le panneau C couvre tout ce que le</text><text x="20" y="205" class="st" text-anchor="start">collecteur a enregistré. Unité : requêtes.</text><text x="20" y="232" class="vl" text-anchor="start">A. GET 200 par niveau d’identification enregistré</text><text x="20" y="257" class="lb" text-anchor="start">origine fournisseur, registre officiel</text><rect x="20" y="264" width="325" height="18" fill="var(--band)"></rect><path d="M20,264H26.89Q30.89,264 30.89,268V278Q30.89,282 26.89,282H20Z" fill="var(--s1)"><title>origine fournisseur, registre officiel: 335</title></path><text x="351" y="277" class="vl" text-anchor="start">335</text><text x="20" y="315" class="lb" text-anchor="start">nom déclaré + signal réseau (en revue)</text><rect x="20" y="322" width="325" height="18" fill="var(--band)"></rect><path d="M20,322H42.88Q46.88,322 46.88,326V336Q46.88,340 42.88,340H20Z" fill="var(--neutral)"><title>nom déclaré + signal réseau (en revue): 827</title></path><text x="351" y="335" class="vl" text-anchor="start">827</text><text x="20" y="373" class="lb" text-anchor="start">non attribué (en revue)</text><rect x="20" y="380" width="325" height="18" fill="var(--band)"></rect><path d="M20,380H314.55Q318.55,380 318.55,384V394Q318.55,398 314.55,398H20Z" fill="var(--neutral)"><title>non attribué (en revue): 9186</title></path><text x="351" y="393" class="vl" text-anchor="start">9 186</text><text x="20" y="431" class="lb" text-anchor="start">vérification échouée</text><rect x="20" y="438" width="325" height="18" fill="var(--band)"></rect><path d="M20,438H20Q20.59,438 20.59,438.58V455.42Q20.59,456 20,456H20Z" fill="var(--neutral)"><title>vérification échouée: 18</title></path><text x="351" y="451" class="vl" text-anchor="start">18</text><text x="20" y="488" class="vl" text-anchor="start">B. Requêtes par méthode et statut</text><text x="20" y="513" class="lb" text-anchor="start">GET 200</text><rect x="20" y="520" width="325" height="18" fill="var(--band)"></rect><path d="M20,520H285.52Q289.52,520 289.52,524V534Q289.52,538 285.52,538H20Z" fill="var(--s7)"><title>GET 200: 10366</title></path><text x="351" y="533" class="vl" text-anchor="start">10 366</text><text x="20" y="571" class="lb" text-anchor="start">HEAD 200</text><rect x="20" y="578" width="325" height="18" fill="var(--band)"></rect><path d="M20,578H103.28Q107.28,578 107.28,582V592Q107.28,596 103.28,596H20Z" fill="var(--neutral)"><title>HEAD 200: 3357</title></path><text x="351" y="591" class="vl" text-anchor="start">3 357</text><text x="20" y="629" class="lb" text-anchor="start">GET 304</text><rect x="20" y="636" width="325" height="18" fill="var(--band)"></rect><path d="M20,636H27.41Q31.41,636 31.41,640V650Q31.41,654 27.41,654H20Z" fill="var(--neutral)"><title>GET 304: 439</title></path><text x="351" y="649" class="vl" text-anchor="start">439</text><text x="20" y="687" class="lb" text-anchor="start">POST 405</text><rect x="20" y="694" width="325" height="18" fill="var(--band)"></rect><path d="M20,694H20Q20.47,694 20.47,694.47V711.53Q20.47,712 20,712H20Z" fill="var(--neutral)"><title>POST 405: 18</title></path><text x="351" y="707" class="vl" text-anchor="start">18</text><text x="20" y="744" class="vl" text-anchor="start">C. Toutes les requêtes enregistrées par le collecteur, par population</text><text x="20" y="769" class="lb" text-anchor="start">population documentaire principale</text><rect x="20" y="776" width="325" height="18" fill="var(--band)"></rect><path d="M20,776H323.23Q327.23,776 327.23,780V790Q327.23,794 323.23,794H20Z" fill="var(--neutral)"><title>population documentaire principale: 14180</title></path><text x="351" y="789" class="vl" text-anchor="start">14 180</text><text x="20" y="827" class="lb" text-anchor="start">autres fichiers (soutien, descripteurs, techniques)</text><rect x="20" y="834" width="325" height="18" fill="var(--band)"></rect><path d="M20,834H133.15Q137.15,834 137.15,838V848Q137.15,852 133.15,852H20Z" fill="var(--neutral)"><title>autres fichiers (soutien, descripteurs, techniques): 5407</title></path><text x="351" y="847" class="vl" text-anchor="start">5 407</text><text x="20" y="885" class="lb" text-anchor="start">robots.txt (contrôle)</text><rect x="20" y="892" width="325" height="18" fill="var(--band)"></rect><path d="M20,892H106.28Q110.28,892 110.28,896V906Q110.28,910 106.28,910H20Z" fill="var(--neutral)"><title>robots.txt (contrôle): 4167</title></path><text x="351" y="905" class="vl" text-anchor="start">4 167</text><text x="20" y="943" class="lb" text-anchor="start">compartiment well-known non déclaré</text><rect x="20" y="950" width="325" height="18" fill="var(--band)"></rect><path d="M20,950H38.99Q42.99,950 42.99,954V964Q42.99,968 38.99,968H20Z" fill="var(--neutral)"><title>compartiment well-known non déclaré: 1061</title></path><text x="351" y="963" class="vl" text-anchor="start">1 061</text><text x="20" y="1002" class="ax" text-anchor="start">Les réponses HEAD, 304, 3xx et 4xx ne sont pas des corps</text><text x="20" y="1017" class="ax" text-anchor="start">de documents récupérés avec succès. Les niveaux non</text><text x="20" y="1032" class="ax" text-anchor="start">attribué et réseau déclaré dépendent d’un prédicat</text><text x="20" y="1047" class="ax" text-anchor="start">Cloudflare en revue.</text><line x1="20" y1="1070" x2="400" y2="1070" class="grid"/><text x="20" y="1088" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r2. Données du 15 septembre</text><text x="20" y="1103" class="ft" text-anchor="start">au 14 octobre 2026 inclusivement, en UTC (fin exclusive</text><text x="20" y="1118" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="1133" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à 22:58 UTC ;</text><text x="20" y="1148" class="ft" text-anchor="start">couverture : rapports d’archive partiels déclarés 30 jours</text><text x="20" y="1163" class="ft" text-anchor="start">sur 30.</text><text x="20" y="1178" class="ft" text-anchor="start">Table source :</text><text x="20" y="1193" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/consultations.csv,</text><text x="20" y="1208" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/resources.csv,</text><text x="20" y="1223" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r2/daily-summary.csv</text></svg>
