<svg xmlns="http://www.w3.org/2000/svg" width="960" height="569" viewBox="0 0 960 569" role="img" aria-labelledby="title desc"><title id="title">Couples site-chemin distincts demandés, et récurrence</title><desc id="desc">Le panneau A compare, par site, les couples de la population principale avec lignes et ceux avec GET 200 IA à origine fournisseur. Le panneau B indique combien de couples demandés ont reçu de telles requêtes sur 1, 2 à 3, 4 à 7 ou 8 jours UTC et plus.</desc><style>
