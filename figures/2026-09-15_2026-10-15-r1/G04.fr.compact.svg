</style><rect x="0" y="0" width="420" height="797" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Couples site-chemin distincts demandés,</text><text x="20" y="52" class="t" text-anchor="start">et récurrence</text><text x="20" y="76" class="st" text-anchor="start">Du 15 septembre au 14 octobre 2026 inclusivement, en</text><text x="20" y="93" class="st" text-anchor="start">UTC.</text><text x="20" y="110" class="st" text-anchor="start">Unité : couples site-chemin (URL), pas des</text><text x="20" y="127" class="st" text-anchor="start">consommateurs. Les distincts sont calculés sur les</text><text x="20" y="144" class="st" text-anchor="start">couples, jamais en additionnant des comptes par</text><text x="20" y="161" class="st" text-anchor="start">acteur.</text><text x="20" y="188" class="vl" text-anchor="start">A. Population documentaire principale : couples avec</text><text x="20" y="204" class="vl" text-anchor="start">lignes dans la fenêtre, et couples avec au moins un</text><text x="20" y="220" class="vl" text-anchor="start">GET 200 IA à origine fournisseur</text><text x="142" y="250" class="lb" text-anchor="end">gautierdorval.com</text><rect x="150" y="238" width="165.73" height="16" fill="var(--neutral2)"><title>gautierdorval.com: 113 pairs with rows</title></rect><path d="M150,242H209.07Q213.07,242 213.07,246V246Q213.07,250 209.07,250H150Z" fill="var(--s1)"><title>gautierdorval.com: 43 pairs with provider-origin AI GET 200</title></path><text x="321.73" y="250" class="vl" text-anchor="start">43 sur 113</text><text x="142" y="284" class="lb" text-anchor="end">pagup.com</text><rect x="150" y="272" width="89.47" height="16" fill="var(--neutral2)"><title>pagup.com: 61 pairs with rows</title></rect><path d="M150,276H206.13Q210.13,276 210.13,280V280Q210.13,284 206.13,284H150Z" fill="var(--s2)"><title>pagup.com: 41 pairs with provider-origin AI GET 200</title></path><text x="245.47" y="284" class="vl" text-anchor="start">41 sur 61</text><text x