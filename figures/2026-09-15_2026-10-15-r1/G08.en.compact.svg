<svg xmlns="http://www.w3.org/2000/svg" width="420" height="676" viewBox="0 0 420 676" role="img" aria-labelledby="title desc"><title id="title">Coverage calendar and measurement versions</title><desc id="desc">A calendar of 30 day cells, all hatched as partial reports, two marked with an aggregate/V3 gap, above the producer deployment active during the window and the classifier version.</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6e69;--grid:#e1e0d9;--axis:#c9c8c1;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s5:#e87ba4;--s7:#6250d6;--neutral:#a3a29b;--neutral2:#d4d3cc;
--missing:#7a5c00;--band:#f3efe2}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a29b;
--grid:#2c2c2a;--axis:#4a4945;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s5:#d55181;--s7:#9085e9;
--neutral:#7d7c76;--neutral2:#4a4945;--missing:#e0b84a;--band:#2a2720}}
text{font-family:system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, &apos;Noto Sans&apos;, &apos;Liberation Sans&apos;, Arial, sans-serif;fill:var(--ink)}
.t{font-size:17px;font-weight:600}.st{font-size:13px;fill:var(--ink2)}.ax{font-size:12px;fill:var(--muted)}
.lb{font-size:12.5px;fill:var(--ink2)}.vl{font-size:12.5px;font-weight:600;fill:var(--ink)}
.ft{font-size:11.5px;fill:var(--muted)}.na{font-size:15px;font-weight:600;fill:var(--missing)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
</style><defs><pattern id="partial" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--band)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--missing)" stroke-width="1.5"/></pattern></defs><rect x="0" y="0" width="420" height="676" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Coverage calendar and measurement</text><text x="20" y="52" class="t" text-anchor="start">versions</text><text x="20" y="76" class="st" text-anchor="start">September 15 to October 14, 2026 inclusive, UTC.</text><text x="20" y="93" class="st" text-anchor="start">Each cell is one UTC day. Status comes from the</text><text x="20" y="110" class="st" text-anchor="start">archived daily report; agreement of counts is not</text><text x="20" y="127" class="st" text-anchor="start">proof of complete coverage.</text><rect x="21" y="154" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-15: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="39" y="202" class="ax" text-anchor="middle">15</text><rect x="59" y="154" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-16: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="77" y="202" class="ax" text-anchor="middle">16</text><rect x="97" y="154" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-17: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="115" y="202" class="ax" text-anchor="middle">17</text><rect x="135" y="154" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-18: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="153" y="202" class="ax" text-anchor="middle">18</text><rect x="173" y="154" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-19: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="191" y="202" class="ax" text-anchor="middle">19</text><rect x="211" y="154" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-20: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="229" y="202" class="ax" text-anchor="middle">20</text><rect x="249" y="154" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-21: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="267" y="202" class="ax" text-anchor="middle">21</text><rect x="287" y="154" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-22: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="305" y="202" class="ax" text-anchor="middle">22</text><rect x="325" y="154" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-23: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="343" y="202" class="ax" text-anchor="middle">23</text><rect x="363" y="154" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-24: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="381" y="202" class="ax" text-anchor="middle">24</text><rect x="21" y="214" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-25: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="39" y="262" class="ax" text-anchor="middle">25</text><rect x="59" y="214" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-26: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="77" y="262" class="ax" text-anchor="middle">26</text><rect x="97" y="214" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-27: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="115" y="262" class="ax" text-anchor="middle">27</text><rect x="135" y="214" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-28: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="153" y="262" class="ax" text-anchor="middle">28</text><rect x="173" y="214" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-29: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="191" y="262" class="ax" text-anchor="middle">29</text><rect x="211" y="214" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-09-30: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="229" y="262" class="ax" text-anchor="middle">30</text><rect x="249" y="214" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-01: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="267" y="262" class="ax" text-anchor="middle">1</text><rect x="287" y="214" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-02: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="305" y="262" class="ax" text-anchor="middle">2</text><rect x="325" y="214" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-03: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="343" y="262" class="ax" text-anchor="middle">3</text><rect x="363" y="214" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-04: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="381" y="262" class="ax" text-anchor="middle">4</text><rect x="21" y="274" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-05: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="39" y="322" class="ax" text-anchor="middle">5</text><rect x="59" y="274" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-06: partial_declared; AGGREGATE_V3_COUNT_MISMATCH</title></rect><circle cx="77" cy="292" r="4" fill="var(--missing)"/><text x="77" y="322" class="ax" text-anchor="middle">6</text><rect x="97" y="274" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-07: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="115" y="322" class="ax" text-anchor="middle">7</text><rect x="135" y="274" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-08: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="153" y="322" class="ax" text-anchor="middle">8</text><rect x="173" y="274" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-09: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="191" y="322" class="ax" text-anchor="middle">9</text><rect x="211" y="274" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-10: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="229" y="322" class="ax" text-anchor="middle">10</text><rect x="249" y="274" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-11: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="267" y="322" class="ax" text-anchor="middle">11</text><rect x="287" y="274" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-12: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="305" y="322" class="ax" text-anchor="middle">12</text><rect x="325" y="274" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-13: partial_declared; AGGREGATE_V3_COUNT_MISMATCH</title></rect><circle cx="343" cy="292" r="4" fill="var(--missing)"/><text x="343" y="322" class="ax" text-anchor="middle">13</text><rect x="363" y="274" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-14: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="381" y="322" class="ax" text-anchor="middle">14</text><text x="20" y="340" class="vl" text-anchor="start">Producer deployment active during the day (from the</text><text x="20" y="356" class="vl" text-anchor="start">producer's deployment history) and classifier version</text><rect x="21" y="372" width="378" height="18" fill="var(--band)" rx="3"><title>pd01: 2026-09-15 to 2026-10-14</title></rect><text x="210" y="385" class="ax" text-anchor="middle">pd01</text><rect x="21" y="398" width="378" height="18" fill="var(--band)" rx="3"></rect><text x="210" y="411" class="ax" text-anchor="middle">classifier 2026-08-24.1 throughout (predicate under review)</text><text x="20" y="432" class="ax" text-anchor="start">Hatched cell: archive report partial (declared). Dot:</text><text x="20" y="447" class="ax" text-anchor="start">aggregate/V3 gap of one request. No day is missing;</text><text x="20" y="462" class="ax" text-anchor="start">every daily total of the joint aggregate equals the</text><text x="20" y="477" class="ax" text-anchor="start">archived aggregate count. The deployment history was</text><text x="20" y="492" class="ax" text-anchor="start">observed about every 6 hours; a deployment shorter than</text><text x="20" y="507" class="ax" text-anchor="start">the longest gap between observations cannot be excluded.</text><line x1="20" y1="530" x2="400" y2="530" class="grid"/><text x="20" y="548" class="ft" text-anchor="start">Edition 2026-09-15_2026-10-15-r1. Data September 15 to</text><text x="20" y="563" class="ft" text-anchor="start">October 14, 2026 inclusive, UTC (end exclusive</text><text x="20" y="578" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="593" class="ft" text-anchor="start">Extracted 2026-10-16 22:57 to 22:58 UTC; coverage: archive</text><text x="20" y="608" class="ft" text-anchor="start">reports partial (declared) on 30 of 30 days.</text><text x="20" y="623" class="ft" text-anchor="start">Source table:</text><text x="20" y="638" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r1/coverage.csv,</text><text x="20" y="653" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r1/catalog.json</text></svg>
