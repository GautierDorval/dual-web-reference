 mêmes ressources figurent dans</text><text x="20" y="493" class="ax" text-anchor="start">links.csv. Trait plein : lien ou référence écrit dans le fichier (html_anchor, markdown_link, json_reference). Pointillé : mention d’URL</text><text x="20" y="508" class="ax" text-anchor="start">ou relation déclarée. L’absence de flèche signifie « non tracé ou non trouvé dans ce graphe », pas « jamais référencé ».</text><line x1="20" y1="531" x2="940" y2="531" class="grid"/><text x="20" y="549" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r1. Graphe : instantané source du 2026-10-06 (date UTC), pas des données de requêtes. Fenêtre de mesure de</text><text x="20" y="564" class="ft" text-anchor="start">l’édition : du 15 septembre au 14 octobre 2026 inclusivement, en UTC (fin exclusive 2026-10-15T00:00:00Z).</text><text x="20" y="579" class="ft" text-anchor="start">Données de requêtes de l’édition extraites le 2026-10-16 à 22:57 UTC. Couverture : relations écrites dans les fichiers de l’instantané</text><text x="20" y="594" class="ft" text-anchor="start">seulement (ancres pour les pages HTML) ; le déploiement de cette version exacte pendant la fenêtre n’est pas établi.</text><text x="20" y="609" class="ft" text-anchor="start">Table source : data/editions/2026-09-15_2026-10-15-r1/links.csv</text></svg>
