</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--ink2)"/></marker></defs><rect x="0" y="0" width="960" height="632" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Relations documentaires vérifiées dans l’instantané source : pagup.com</text><text x="20" y="54" class="st" text-anchor="start">Instantané du graphe graph-pg-20261006-f8126bdf (2026-10-06). Une flèche signifie « ce fichier mentionne ce fichier ». Ce ne</text><text x="20" y="71" class="st" text-anchor="start">sont pas des parcours de robots observés.</text><text x="20" y="88" class="st" text-anchor="start">Sélection : page de départ du cas et ressources représentatives ; les relations d’une colonne à la suivante sont tracées, les</text><text x="20" y="105" class="st" text-anchor="start">autres sont comptées plus bas.</text><path d="M205,156C230,156 230,156 255,156" fill="none" stroke="var(--ink2)" stroke-width="1.5" marker-end="url(#arrow)"><title>/ → /ai-usage-policy/ (html_anchor)</title></path><path d="M430,156C455,156 455,156 480,156" fill="none" stroke="var(--ink2)" stroke-width="1.5" marker-end="url(#arrow)"><title>/ai-usage-policy/ → /dualweb-index.md (html_anchor)</title></path><path d="M430,156C455,156 455,202 480,202" fill="none" stroke="var(--ink2)" stroke-width="1.5" marker-end="url(#arrow)"><title>/ai-usage-policy/ → /identity.json (html_anchor)</title></path><path d="M655,156C680,156 680,294 705,294" fill="none" stroke="var(--ink2)" stroke-width="1.5" marker-end="url(#arrow)"><title>/dualweb-index.md → /canon.md (markdown_link)</title></path><path d="M655,156C680,156 680,386 705,386" fill="none" stroke="var(--ink2)" stroke-width="1.5" marker-end="url(#arrow)"><title>/dualweb-index.md → /claims.json (markdown_link)</title></path><path d="M655,156C680,156 680,248 705,248" fill="none" stroke="var(--ink2)" stroke-width="1.5" marker-end="url(#arrow)"><ti