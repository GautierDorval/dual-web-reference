</style><rect x="0" y="0" width="960" height="522" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Requêtes IA à origine fournisseur selon le rôle enregistré de l’acteur</text><text x="20" y="54" class="st" text-anchor="start">Du 15 septembre au 14 octobre 2026 inclusivement, en UTC.</text><text x="20" y="71" class="st" text-anchor="start">Panneau A : population documentaire principale. Panneau B : périmètre du relevé initial, pour le rapprochement. Les deux sont</text><text x="20" y="88" class="st" text-anchor="start">exacts, tirés de l’agrégat conjoint.</text><text x="20" y="105" class="st" text-anchor="start">Unité : requêtes GET 200. Les rôles restent distincts ; une récupération à la demande peut être déclenchée par n’importe qui,</text><text x="20" y="122" class="st" text-anchor="start">y compris l’exploitant du site.</text><text x="20" y="149" class="vl" text-anchor="start">A. Population documentaire principale</text><line x1="350" y1="157" x2="350" y2="245" class="grid"/><line x1="487.5" y1="157" x2="487.5" y2="245" class="grid"/><line x1="625" y1="157" x2="625" y2="245" class="grid"/><line x1="762.5" y1="157" x2="762.5" y2="245" class="grid"/><line x1="900" y1="157" x2="900" y2="245" class="grid"/><text x="342" y="174" class="lb" text-anchor="end">collecte pour entraînement (ai_training)</text><path d="M350,161H621Q625,161 625,165V175Q625,179 621,179H350Z" fill="var(--s1)"><title>collecte pour entraînement (ai_training): 200</title></path><text x="631" y="174" class="vl" text-anchor="start">200</text><text x="342" y="202" class="lb" text-anchor="end">recherche IA (ai_search)</text><path d="M350,189H387.25Q391.25,189 391.25,193V203Q391.25,207 387.25,207H350Z" fill="var(--s1)"><title>recherche IA (ai_search): 30</title></path><text x="397.25" y="202" class="vl" text-anchor="start">30</text><text x="342" y="224" class="lb" text-anchor="end">récupération à la demande</text><text x="342" y="237" class="lb" text-anchor="end">(user_initiated_fetch)</text><path d="M350,217H366.62Q370.62,217 370.62,221V231Q370.62,235 366.62,235H350Z" fill="var(--s1)"><title>récupération à la demande (user_initiated_fetch): 15</title></path><text x="376.62" y="230" class="vl" text-anchor="start">15</text><text x="350" y="257" class="ax" text-anchor="middle">0</text><text x="487.5" y="257" class="ax" text-anchor="middle">100</text><text x="625" y="257" class="ax" text-anchor="middle">200</text><text x="762.5" y="257" class="ax" text-anchor="middle">300</text><text x="900" y="257" class="ax" text-anchor="middle">400</text><text x="20" y="281" class="vl" text-anchor="start">B. Périmètre du relevé initial</text><line x1="350" y1="289" x2="350" y2="377" class="grid"/><line x1="487.5" y1="289" x2="487.5" y2="377" class="grid"/><line x1="625" y1="289" x2="625" y2="377" class="grid"/><line x1="762.5" y1="289" x2="762.5" y2="377" class="grid"/><line x1="900" y1="289" x2="900" y2="377" class="grid"/><text x="342" y="306" class="lb" text-anchor="end">collecte pour entraînement (ai_training)</text><path d="M350,293H761.25Q765.25,293 765.25,297V307Q765.25,311 761.25,311H350Z" fill="var(--neutral)"><title>collecte pour entraînement (ai_training): 302</title></path><text x="771.25" y="306" class="vl" text-anchor="start">302</text><text x="342" y="334" class="lb" text-anchor="end">recherche IA (ai_search)</text><path d="M350,321H406.5Q410.5,321 410.5,325V335Q410.5,339 406.5,339H350Z" fill="var(--neutral)"><title>recherche IA (ai_search): 44</title></path><text x="416.5" y="334" class="vl" text-anchor="start">44</text><text x="342" y="356" class="lb" text-anchor="end">récupération à la demande</text><text x="342" y="369" class="lb" text-anchor="end">(user_initiated_fetch)</text><path d="M350,349H381.75Q385.75,349 385.75,353V363Q385.75,367 381.75,367H350Z" fill="var(--neutral)"><title>récupération à la demande (user_initiated_fetch): 26</title></path><text x="391.75" y="362" class="vl" text-anchor="start">26</text><text x="350" y="389" class="ax" text-anchor="middle">0</text><text x="487.5" y="389" class="ax" text-anchor="middle">100</text><text x="625" y="389" class="ax" text-anchor="middle">200</text><text x="762.5" y="389" class="ax" text-anchor="middle">300</text><text x="900" y="389" class="ax" text-anchor="middle">400</text><text x="20" y="413" class="ax" text-anchor="start">Sensibilité sans récupérations à la demande (population principale) : 230 requêtes sur 172 couples. C’est une analyse de sensibilité,</text><text x="20" y="428" class="ax" text-anchor="start">pas une preuve que les autres requêtes étaient indépendantes.</text><line x1="20" y1="451" x2="940" y2="451" class="grid"/><text x="20" y="469" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r1. Données du 15 septembre au 14 octobre 2026 inclusivement, en UTC (fin exclusive 2026-10-15T00:00:00Z).</text><text x="20" y="484" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à 22:58 UTC ; couverture : rapports d’archive partiels déclarés 30 jours sur 30.</text><text x="20" y="499" class="ft" text-anchor="start">Table source : data/editions/2026-09-15_2026-10-15-r1/consultations.csv, data/editions/2026-09-15_2026-10-15-r1/resources.csv</text></svg>
