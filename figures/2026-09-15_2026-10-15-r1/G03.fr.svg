<svg xmlns="http://www.w3.org/2000/svg" width="960" height="522" viewBox="0 0 960 522" role="img" aria-labelledby="title desc"><title id="title">Requêtes IA à origine fournisseur selon le rôle enregistré de l’acteur</title><desc id="desc">Deux panneaux de barres horizontales des requêtes GET 200 IA à origine fournisseur par rôle enregistré : population documentaire principale, puis périmètre du relevé initial.</desc><style>
