</style><rect x="0" y="0" width="420" height="749" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Requêtes IA à origine fournisseur selon</text><text x="20" y="52" class="t" text-anchor="start">le rôle enregistré de l’acteur</text><text x="20" y="76" class="st" text-anchor="start">Du 15 septembre au 14 octobre 2026 inclusivement, en</text><text x="20" y="93" class="st" text-anchor="start">UTC.</text><text x="20" y="110" class="st" text-anchor="start">Panneau A : population documentaire principale.</text><text x="20" y="127" class="st" text-anchor="start">Panneau B : périmètre du relevé initial, pour le</text><text x="20" y="144" class="st" text-anchor="start">rapprochement. Les deux sont exacts, tirés de</text><text x="20" y="161" class="st" text-anchor="start">l’agrégat conjoint.</text><text x="20" y="178" class="st" text-anchor="start">Unité : requêtes GET 200. Les rôles restent</text><text x="20" y="195" class="st" text-anchor="start">distincts ; une récupération à la demande peut être</text><text x="20" y="212" class="st" text-anchor="start">déclenchée par n’importe qui, y compris l’exploitant</text><text x="20" y="229" class="st" text-anchor="start">du site.</text><text x="20" y="256" class="vl" text-anchor="start">A. Population documentaire principale</text><line x1="170" y1="264" x2="170" y2="352" class="grid"/><line x1="217.5" y1="264" x2="217.5" y2="352" class="grid"/><line x1="265" y1="264" x2="265" y2="352" class="grid"/><line x1="312.5" y1="264" x2="312.5" y2="352" class="grid"/><line x1="360" y1="264" x2="360" y2="352" class="grid"/><text x="162" y="275" class="lb" text-anchor="end">collecte pour</text><text x="162" y="288" class="lb" text-anchor="end">entraînement</text><path d="M170,268H261Q265,268 265,272V282Q265,286 261,286H170Z" fill="var(--s1)"><title>collecte pour entraînement (ai_training): 200</title></path><text x="271" y="281" class="vl" text-anchor="start">200</text><text x="162" y="303" class="lb" text-anchor="end">recherche IA</text><text x="162" y="316" class="lb" text-anchor="end">(ai_search)</text><path d="M170,296H180.25Q184.25,296 184.25,300V310Q184.25,314 180.25,314H170Z" fill="var(--s1)"><title>recherche IA (ai_search): 30</title></path><text x="190.25" y="309" class="vl" text-anchor="start">30</text><text x="162" y="331" class="lb" text-anchor="end">récupération à la</text><text x="162" y="344" class="lb" text-anchor="end">demande</text><path d="M170,324H173.12Q177.12,324 177.12,328V338Q177.12,342 173.12,342H170Z" fill="var(--s1)"><title>récupération à la demande (user_initiated_fetch): 15</title></path><text x="183.12" y="337" class="vl" text-anchor="start">15</text><text x="170" y="364" class="ax" text-anchor="middle">0</text><text x="217.5" y="364" class="ax" text-anchor="middle">100</text><text x="265" y="364" class="ax" text-anchor="middle">200</text><text x="312.5" y="364" class="ax" text-anchor="middle">300</text><text x="360" y="364" class="ax" text-anchor="middle">400</text><text x="20" y="388" class="vl" text-anchor="start">B. Périmètre du relevé initial</text><line x1="170" y1="396" x2="170" y2="484" class="grid"/><line x1="217.5" y1="396" x2="217.5" y2="484" class="grid"/><line x1="265" y1="396" x2="265" y2="484" class="grid"/><line x1="312.5" y1="396" x2="312.5" y2="484" class="grid"/><line x1="360" y1="396" x2="360" y2="484" class="grid"/><text x="162" y="407" class="lb" text-anchor="end">collecte pour</text><text x="162" y="420" class="lb" text-anchor="end">entraînement</text><path d="M170,400H309.45Q313.45,400 313.45,404V414Q313.45,418 309.45,418H170Z" fill="var(--neutral)"><title>collecte pour entraînement (ai_training): 302</title></path><text x="319.45" y="413" class="vl" text-anchor="start">302</text><text x="162" y="435" class="lb" text-anchor="end">recherche IA</text><text x="162" y="448" class="lb" text-anchor="end">(ai_search)</text><path d="M170,428H186.9Q190.9,428 190.9,432V442Q190.9,446 186.9,446H170Z" fill="var(--neutral)"><title>recherche IA (ai_search): 44</title></path><text x="196.9" y="441" class="vl" text-anchor="start">44</text><text x="162" y="463" class="lb" text-anchor="end">récupération à la</text><text x="162" y="476" class="lb" text-anchor="end">demande</text><path d="M170,456H178.35Q182.35,456 182.35,460V470Q182.35,474 178.35,474H170Z" fill="var(--neutral)"><title>récupération à la demande (user_initiated_fetch): 26</title></path><text x="188.35" y="469" class="vl" text-anchor="start">26</text><text x="170" y="496" class="ax" text-anchor="middle">0</text><text x="217.5" y="496" class="ax" text-anchor="middle">100</text><text x="265" y="496" class="ax" text-anchor="middle">200</text><text x="312.5" y="496" class="ax" text-anchor="middle">300</text><text x="360" y="496" class="ax" text-anchor="middle">400</text><text x="20" y="520" class="ax" text-anchor="start">Sensibilité sans récupérations à la demande (population</text><text x="20" y="535" class="ax" text-anchor="start">principale) : 230 requêtes sur 172 couples. C’est une</text><text x="20" y="550" class="ax" text-anchor="start">analyse de sensibilité, pas une preuve que les autres</text><text x="20" y="565" class="ax" text-anchor="start">requêtes étaient indépendantes.</text><line x1="20" y1="588" x2="400" y2="588" class="grid"/><text x="20" y="606" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r1. Données du 15 septembre</text><text x="20" y="621" class="ft" text-anchor="start">au 14 octobre 2026 inclusivement, en UTC (fin exclusive</text><text x="20" y="636" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="651" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à 22:58 UTC ;</text><text x="20" y="666" class="ft" text-anchor="start">couverture : rapports d’archive partiels déclarés 30 jours</text><text x="20" y="681" class="ft" text-anchor="start">sur 30.</text><text x="20" y="696" class="ft" text-anchor="start">Table source :</text><text x="20" y="711" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r1/consultations.csv,</text><text x="20" y="726" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r1/resources.csv</text></svg>
