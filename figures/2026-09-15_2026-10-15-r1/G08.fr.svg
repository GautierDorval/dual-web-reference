><text x="20" y="173.67" class="vl" text-anchor="start">Déploiement du producteur actif pendant la journée (historique de déploiement du producteur) et version du classificateur</text><rect x="21" y="189.67" width="918" height="18" fill="var(--band)" rx="3"><title>pd01: 2026-09-15 to 2026-10-14</title></rect><text x="480" y="202.67" class="ax" text-anchor="middle">pd01 (100 %, effectif avant la fenêtre)</text><rect x="21" y="215.67" width="918" height="18" fill="var(--band)" rx="3"></rect><text x="480" y="228.67" class="ax" text-anchor="middle">classificateur 2026-08-24.1 sur toute la période (prédicat en revue)</text><text x="20" y="249.67" class="ax" text-anchor="start">Cellule hachurée : rapport d’archive partiel (déclaré). Point : écart agrégat/V3 d’une requête. Aucun jour manquant ; chaque total</text><text x="20" y="264.67" class="ax" text-anchor="start">quotidien de l’agrégat conjoint égale le compte agrégé archivé. L’historique de déploiement a été relevé environ toutes les 6 heures ;</text><text x="20" y="279.67" class="ax" text-anchor="start">un déploiement plus court que le plus long intervalle entre deux relevés ne peut pas être exclu.</text><line x1="20" y1="302.67" x2="940" y2="302.67" class="grid"/><text x="20" y="320.67" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r1. Données du 15 septembre au 14 octobre 2026 inclusivement, en UTC (fin exclusive 2026-10-15T00:00:00Z).</text><text x="20" y="335.67" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à 22:58 UTC ; couverture : rapports d’archive partiels déclarés 30 jours sur 30.</text><text x="20" y="350.67" class="ft" text-anchor="start">Table source : data/editions/2026-09-15_2026-10-15-r1/coverage.csv, data/editions/2026-09-15_2026-10-15-r1/catalog.json</text></svg>
