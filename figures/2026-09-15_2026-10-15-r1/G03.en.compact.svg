</style><rect x="0" y="0" width="420" height="683" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Provider-origin AI requests by recorded</text><text x="20" y="52" class="t" text-anchor="start">actor role</text><text x="20" y="76" class="st" text-anchor="start">September 15 to October 14, 2026 inclusive, UTC.</text><text x="20" y="93" class="st" text-anchor="start">Panel A: main documentary population. Panel B: scope</text><text x="20" y="110" class="st" text-anchor="start">of the initial report, for reconciliation. Both</text><text x="20" y="127" class="st" text-anchor="start">exact, from the joint aggregate.</text><text x="20" y="144" class="st" text-anchor="start">Unit: GET 200 requests. Roles stay distinct; a</text><text x="20" y="161" class="st" text-anchor="start">user-initiated fetch can be triggered by anyone,</text><text x="20" y="178" class="st" text-anchor="start">including the site operator.</text><text x="20" y="205" class="vl" text-anchor="start">A. Main documentary population</text><line x1="170" y1="213" x2="170" y2="301" class="grid"/><line x1="217.5" y1="213" x2="217.5" y2="301" class="grid"/><line x1="265" y1="213" x2="265" y2="301" class="grid"/><line x1="312.5" y1="213" x2="312.5" y2="301" class="grid"/><line x1="360" y1="213" x2="360" y2="301" class="grid"/><text x="162" y="224" class="lb" text-anchor="end">collection for</text><text x="162" y="237" class="lb" text-anchor="end">training</text><path d="M170,217H261Q265,217 265,221V231Q265,235 261,235H170Z" fill="var(--s1)"><title>collection for training (ai_training): 200</title></path><text x="271" y="230" class="vl" text-anchor="start">200</text><text x="162" y="252" class="lb" text-anchor="end">AI search</text><text x="162" y="265" class="lb" text-anchor="end">(ai_search)</text><path d="M170,245H180.25Q184.25,245 184.25,249V259Q184.25,263 180.25,263H170Z" fill="var(--s1)"><title>AI search (ai_search): 30</title></path><text x="190.25" y="258" class="vl" text-anchor="start">30</text><text x="162" y="280" class="lb" text-anchor="end">user-initiated fetch</text><text x="162" y="293" class="lb" text-anchor="end">(user_initiated_fetch)</text><path d="M170,273H173.12Q177.12,273 177.12,277V287Q177.12,291 173.12,291H170Z" fill="var(--s1)"><title>user-initiated fetch (user_initiated_fetch): 15</title></path><text x="183.12" y="286" class="vl" text-anchor="start">15</text><text x="170" y="313" class="ax" text-anchor="middle">0</text><text x="217.5" y="313" class="ax" text-anchor="middle">100</text><text x="265" y="313" class="ax" text-anchor="middle">200</text><text x="312.5" y="313" class="ax" text-anchor="middle">300</text><text x="360" y="313" class="ax" text-anchor="middle">400</text><text x="20" y="337" class="vl" text-anchor="start">B. Scope of the initial report</text><line x1="170" y1="345" x2="170" y2="433" class="grid"/><line x1="217.5" y1="345" x2="217.5" y2="433" class="grid"/><line x1="265" y1="345" x2="265" y2="433" class="grid"/><line x1="312.5" y1="345" x2="312.5" y2="433" class="grid"/><line x1="360" y1="345" x2="360" y2="433" class="grid"/><text x="162" y="356" class="lb" text-anchor="end">collection for</text><text x="162" y="369" class="lb" text-anchor="end">training</text><path d="M170,349H309.45Q313.45,349 313.45,353V363Q313.45,367 309.45,367H170Z" fill="var(--neutral)"><title>collection for training (ai_training): 302</title></path><text x="319.45" y="362" class="vl" text-anchor="start">302</text><text x="162" y="384" class="lb" text-anchor="end">AI search</text><text x="162" y="397" class="lb" text-anchor="end">(ai_search)</text><path d="M170,377H186.9Q190.9,377 190.9,381V391Q190.9,395 186.9,395H170Z" fill="var(--neutral)"><title>AI search (ai_search): 44</title></path><text x="196.9" y="390" class="vl" text-anchor="start">44</text><text x="162" y="412" class="lb" text-anchor="end">user-initiated fetch</text><text x="162" y="425" class="lb" text-anchor="end">(user_initiated_fetch)</text><path d="M170,405H178.35Q182.35,405 182.35,409V419Q182.35,423 178.35,423H170Z" fill="var(--neutral)"><title>user-initiated fetch (user_initiated_fetch): 26</title></path><text x="188.35" y="418" class="vl" text-anchor="start">26</text><text x="170" y="445" class="ax" text-anchor="middle">0</text><text x="217.5" y="445" class="ax" text-anchor="middle">100</text><text x="265" y="445" class="ax" text-anchor="middle">200</text><text x="312.5" y="445" class="ax" text-anchor="middle">300</text><text x="360" y="445" class="ax" text-anchor="middle">400</text><text x="20" y="469" class="ax" text-anchor="start">Sensitivity without user-initiated fetches (main</text><text x="20" y="484" class="ax" text-anchor="start">population): 230 requests on 172 pairs. This is a</text><text x="20" y="499" class="ax" text-anchor="start">sensitivity analysis, not evidence that the other</text><text x="20" y="514" class="ax" text-anchor="start">requests were independent.</text><line x1="20" y1="537" x2="400" y2="537" class="grid"/><text x="20" y="555" class="ft" text-anchor="start">Edition 2026-09-15_2026-10-15-r1. Data September 15 to</text><text x="20" y="570" class="ft" text-anchor="start">October 14, 2026 inclusive, UTC (end exclusive</text><text x="20" y="585" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="600" class="ft" text-anchor="start">Extracted 2026-10-16 22:57 to 22:58 UTC; coverage: archive</text><text x="20" y="615" class="ft" text-anchor="start">reports partial (declared) on 30 of 30 days.</text><text x="20" y="630" class="ft" text-anchor="start">Source table:</text><text x="20" y="645" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r1/consultations.csv,</text><text x="20" y="660" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r1/resources.csv</text></svg>
