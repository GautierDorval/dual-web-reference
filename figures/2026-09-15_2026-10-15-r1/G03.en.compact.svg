<svg xmlns="http://www.w3.org/2000/svg" width="420" height="683" viewBox="0 0 420 683" role="img" aria-labelledby="title desc"><title id="title">Provider-origin AI requests by recorded actor role</title><desc id="desc">Two panels of horizontal bars of provider-origin AI GET 200 requests per recorded role: main documentary population, then the initial report scope.</desc><style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6e69;--grid:#e1e0d9;--axis:#c9c8c1;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s5:#e87ba4;--s7:#6250d6;--neutral:#a3a29b;--neutral2:#d4d3cc;
--missing:#7a5c00;--band:#f3efe2}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a29b;
