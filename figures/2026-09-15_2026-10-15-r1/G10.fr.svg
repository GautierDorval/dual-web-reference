</style><rect x="0" y="0" width="960" height="294" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Historique des éditions</text><text x="20" y="54" class="st" text-anchor="start">Éditions mensuelles de référence, fenêtres ancrées le 15 (UTC). Une seule édition existe : aucune tendance n’est calculée.</text><line x1="40" y1="141" x2="930" y2="141" class="axis"/><circle cx="80" cy="141" r="6" fill="var(--s1)"><title>2026-09-15_2026-10-15-r1: 245</title></circle><text x="80" y="121" class="vl" text-anchor="middle">245 requêtes</text><text x="80" y="163" class="ax" text-anchor="middle">2026-09-15_2026-10-15-r1</text><text x="930" y="163" class="ax" text-anchor="end">fenêtre suivante : du 15 octobre au 14 novembre 2026 (31 jours), pas encore disponible</text><text x="20" y="185" class="ax" text-anchor="start">Valeur : requêtes GET 200, population documentaire principale, rôles IA à origine fournisseur. Deux éditions ne sont comparées que si</text><text x="20" y="200" class="ax" text-anchor="start">fenêtres, définitions, couverture, registres, classifications et règles de périmètre le permettent.</text><line x1="20" y1="223" x2="940" y2="223" class="grid"/><text x="20" y="241" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r1. Données du 15 septembre au 14 octobre 2026 inclusivement, en UTC (fin exclusive 2026-10-15T00:00:00Z).</text><text x="20" y="256" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à 22:58 UTC ; couverture : rapports d’archive partiels déclarés 30 jours sur 30.</text><text x="20" y="271" class="ft" text-anchor="start">Table source : data/editions/2026-09-15_2026-10-15-r1/metrics.json</text></svg>
