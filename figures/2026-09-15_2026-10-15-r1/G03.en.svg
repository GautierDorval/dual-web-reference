</style><rect x="0" y="0" width="960" height="505" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Provider-origin AI requests by recorded actor role</text><text x="20" y="54" class="st" text-anchor="start">September 15 to October 14, 2026 inclusive, UTC.</text><text x="20" y="71" class="st" text-anchor="start">Panel A: main documentary population. Panel B: scope of the initial report, for reconciliation. Both exact, from the joint</text><text x="20" y="88" class="st" text-anchor="start">aggregate.</text><text x="20" y="105" class="st" text-anchor="start">Unit: GET 200 requests. Roles stay distinct; a user-initiated fetch can be triggered by anyone, including the site operator.</text><text x="20" y="132" class="vl" text-anchor="start">A. Main documentary population</text><line x1="350" y1="140" x2="350" y2="228" class="grid"/><line x1="487.5" y1="140" x2="487.5" y2="228" class="grid"/><line x1="625" y1="140" x2="625" y2="228" class="grid"/><line x1="762.5" y1="140" x2="762.5" y2="228" class="grid"/><line x1="900" y1="140" x2="900" y2="228" class="grid"/><text x="342" y="157" class="lb" text-anchor="end">collection for training (ai_training)</text><path d="M350,144H621Q625,144 625,148V158Q625,162 621,162H350Z" fill="var(--s1)"><title>collection for training (ai_training): 200</title></path><text x="631" y="157" class="vl" text-anchor="start">200</text><text x="342" y="185" class="lb" text-anchor="end">AI search (ai_search)</text><path d="M350,172H387.25Q391.25,172 391.25,176V186Q391.25,190 387.25,190H350Z" fill="var(--s1)"><title>AI search (ai_search): 30</title></path><text x="397.25" y="185" class="vl" text-anchor="start">30</text><text x="342" y="213" class="lb" text-anchor="end">user-initiated fetch (user_initiated_fetch)</text><path d="M350,200H366.62Q370.62,200 370.62,204V214Q370.62,218 366.62,218H350Z" fill="var(--s1)"><title>user-initiated fetch (user_initiated_fetch): 15</title></path><text x="376.62" y="213" class="vl" text-anchor="start">15</text><text x="350" y="240" class="ax" text-anchor="middle">0</text><text x="487.5" y="240" class="ax" text-anchor="middle">100</text><text x="625" y="240" class="ax" text-anchor="middle">200</text><text x="762.5" y="240" class="ax" text-anchor="middle">300</text><text x="900" y="240" class="ax" text-anchor="middle">400</text><text x="20" y="264" class="vl" text-anchor="start">B. Scope of the initial report</text><line x1="350" y1="272" x2="350" y2="360" class="grid"/><line x1="487.5" y1="272" x2="487.5" y2="360" class="grid"/><line x1="625" y1="272" x2="625" y2="360" class="grid"/><line x1="762.5" y1="272" x2="762.5" y2="360" class="grid"/><line x1="900" y1="272" x2="900" y2="360" class="grid"/><text x="342" y="289" class="lb" text-anchor="end">collection for training (ai_training)</text><path d="M350,276H761.25Q765.25,276 765.25,280V290Q765.25,294 761.25,294H350Z" fill="var(--neutral)"><title>collection for training (ai_training): 302</title></path><text x="771.25" y="289" class="vl" text-anchor="start">302</text><text x="342" y="317" class="lb" text-anchor="end">AI search (ai_search)</text><path d="M350,304H406.5Q410.5,304 410.5,308V318Q410.5,322 406.5,322H350Z" fill="var(--neutral)"><title>AI search (ai_search): 44</title></path><text x="416.5" y="317" class="vl" text-anchor="start">44</text><text x="342" y="345" class="lb" text-anchor="end">user-initiated fetch (user_initiated_fetch)</text><path d="M350,332H381.75Q385.75,332 385.75,336V346Q385.75,350 381.75,350H350Z" fill="var(--neutral)"><title>user-initiated fetch (user_initiated_fetch): 26</title></path><text x="391.75" y="345" class="vl" text-anchor="start">26</text><text x="350" y="372" class="ax" text-anchor="middle">0</text><text x="487.5" y="372" class="ax" text-anchor="middle">100</text><text x="625" y="372" class="ax" text-anchor="middle">200</text><text x="762.5" y="372" class="ax" text-anchor="middle">300</text><text x="900" y="372" class="ax" text-anchor="middle">400</text><text x="20" y="396" class="ax" text-anchor="start">Sensitivity without user-initiated fetches (main population): 230 requests on 172 pairs. This is a sensitivity analysis, not evidence</text><text x="20" y="411" class="ax" text-anchor="start">that the other requests were independent.</text><line x1="20" y1="434" x2="940" y2="434" class="grid"/><text x="20" y="452" class="ft" text-anchor="start">Edition 2026-09-15_2026-10-15-r1. Data September 15 to October 14, 2026 inclusive, UTC (end exclusive 2026-10-15T00:00:00Z).</text><text x="20" y="467" class="ft" text-anchor="start">Extracted 2026-10-16 22:57 to 22:58 UTC; coverage: archive reports partial (declared) on 30 of 30 days.</text><text x="20" y="482" class="ft" text-anchor="start">Source table: data/editions/2026-09-15_2026-10-15-r1/consultations.csv, data/editions/2026-09-15_2026-10-15-r1/resources.csv</text></svg>
