<svg xmlns="http://www.w3.org/2000/svg" width="420" height="739" viewBox="0 0 420 739" role="img" aria-labelledby="title desc"><title id="title">Calendrier de couverture et versions de mesure</title><desc id="desc">Un calendrier de 30 cellules journalières, toutes hachurées comme rapports partiels, deux marquées d’un écart agrégat/V3, au-dessus du déploiement du producteur actif pendant la fenêtre et de la version du classificateur.</desc><style>
