<title>2026-10-07: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="115" y="339" class="ax" text-anchor="middle">7</text><rect x="135" y="291" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-08: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="153" y="339" class="ax" text-anchor="middle">8</text><rect x="173" y="291" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-09: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="191" y="339" class="ax" text-anchor="middle">9</text><rect x="211" y="291" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-10: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="229" y="339" class="ax" text-anchor="middle">10</text><rect x="249" y="291" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-11: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="267" y="339" class="ax" text-anchor="middle">11</text><rect x="287" y="291" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-12: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="305" y="339" class="ax" text-anchor="middle">12</text><rect x="325" y="291" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-13: partial_declared; AGGREGATE_V3_COUNT_MISMATCH</title></rect><circle cx="343" cy="309" r="4" fill="var(--missing)"/><text x="343" y="339" class="ax" text-anchor="middle">13</text><rect x="363" y="291" width="36" height="36" fill="url(#partial)" rx="3"><title>2026-10-14: partial_declared; COLLECTOR_WINDOW_ATTESTATION_MISSING</title></rect><text x="381" y="339" class="ax" text-anchor="middle">14</text><text x="20" y="357" class="vl" text-anchor="start">Déploiement du producteur actif pendant la journée</text><text x="20" y="373" class="vl" text-anchor="start">(historique de déploiement du producteur) et version</text><text x="20" y="389" class="vl" text-anchor="start">du classificateur</text><rect x="21" y="405" width="378" height="18" fill="var(--band)" rx="3"><title>pd01: 2026-09-15 to 2026-10-14</title></rect><text x="210" y="418" class="ax" text-anchor="middle">pd01</text><rect x="21" y="431" width="378" height="18" fill="var(--band)" rx="3"></rect><text x="210" y="444" class="ax" text-anchor="middle">classificateur 2026-08-24.1 sur toute la période (prédicat en revue)</text><text x="20" y="465" class="ax" text-anchor="start">Cellule hachurée : rapport d’archive partiel (déclaré).</text><text x="20" y="480" class="ax" text-anchor="start">Point : écart agrégat/V3 d’une requête. Aucun jour</text><text x="20" y="495" class="ax" text-anchor="start">manquant ; chaque total quotidien de l’agrégat conjoint</text><text x="20" y="510" class="ax" text-anchor="start">égale le compte agrégé archivé. L’historique de</text><text x="20" y="525" class="ax" text-anchor="start">déploiement a été relevé environ toutes les 6 heures ;</text><text x="20" y="540" class="ax" text-anchor="start">un déploiement plus court que le plus long intervalle</text><text x="20" y="555" class="ax" text-anchor="start">entre deux relevés ne peut pas être exclu.</text><line x1="20" y1="578" x2="400" y2="578" class="grid"/><text x="20" y="596" class="ft" text-anchor="start">Édition 2026-09-15_2026-10-15-r1. Données du 15 septembre</text><text x="20" y="611" class="ft" text-anchor="start">au 14 octobre 2026 inclusivement, en UTC (fin exclusive</text><text x="20" y="626" class="ft" text-anchor="start">2026-10-15T00:00:00Z).</text><text x="20" y="641" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à 22:58 UTC ;</text><text x="20" y="656" class="ft" text-anchor="start">couverture : rapports d’archive partiels déclarés 30 jours</text><text x="20" y="671" class="ft" text-anchor="start">sur 30.</text><text x="20" y="686" class="ft" text-anchor="start">Table source :</text><text x="20" y="701" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r1/coverage.csv,</text><text x="20" y="716" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r1/catalog.json</text></svg>
