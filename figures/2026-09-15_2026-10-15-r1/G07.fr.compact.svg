><text x="20" y="845" class="ft" text-anchor="start">Extraction du 2026-10-16 de 22:57 à 22:58 UTC ;</text><text x="20" y="860" class="ft" text-anchor="start">couverture : rapports d’archive partiels déclarés 30 jours</text><text x="20" y="875" class="ft" text-anchor="start">sur 30.</text><text x="20" y="890" class="ft" text-anchor="start">Table source :</text><text x="20" y="905" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r1/consultations.csv,</text><text x="20" y="920" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r1/resources.csv,</text><text x="20" y="935" class="ft" text-anchor="start">data/editions/2026-09-15_2026-10-15-r1/daily-summary.csv</text></svg>
