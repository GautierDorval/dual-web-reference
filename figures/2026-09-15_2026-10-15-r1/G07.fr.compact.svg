</style><rect x="0" y="0" width="420" height="958" fill="var(--surface)"/><text x="20" y="30" class="t" text-anchor="start">Ce que le résultat principal laisse de</text><text x="20" y="52" class="t" text-anchor="start">côté : volume HTTP par niveau</text><text x="20" y="74" class="t" text-anchor="start">d’identification, méthode et statut, et</text><text x="20" y="96" class="t" text-anchor="start">périmètre</text><text x="20" y="120" class="st" text-anchor="start">Du 15 septembre au 14 octobre 2026 inclusivement, en</text><text x="20" y="137" class="st" text-anchor="start">UTC.</text><text x="20" y="154" class="st" text-anchor="start">Figure secondaire. Les panneaux A et B couvrent la</text><text x="20" y="171" class="st" text-anchor="start">population documentaire principale, tous rôles</text><text x="20" y="188" class="st" text-anchor="start">confondus ; le panneau C couvre tout ce que le</text><text x="20" y="205" class="st" text-anchor="start">collecteur a enregistré. Unité : requêtes.</text><text x="20" y="232" class="vl" text-anchor="start">A. GET 200 par niveau d’identification enregistré</text><line x1="190" y1="240" x2="190" y2="356" class="grid"/><line x1="224" y1="240" x2="224" y2="356" class="grid"/><line x1="258" y1="240" x2="258" y2="356" class="grid"/><line x1="292" y1="240" x2="292" y2="356" class="grid"/><line x1="326" y1="240" x2="326" y2="356" class="grid"/><line x1="360" y1="240" x2="360" y2="356" class="grid"/><text x="182" y="251" class="lb" text-anchor="end">origine fournisseur,</text><text x="182" y="264" class="lb" text-anchor="end">registre officiel</text><path d="M190,244H191.69Q195.69,244 195.69,248V258Q195.69,262 191.69,262H190Z" fill="var(--s1)"><title>origine fournisseur, registre officiel: 335</title></path><text x="201.69" y="257" class="vl" text-anchor="start">335</text><text x="182" y="279" class="lb" text-anchor="end">nom déclaré + signal</text><text x="182" y="292" class="lb" text-anchor="end">réseau (en revue)</text><path d="M19